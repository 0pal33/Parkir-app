<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parkir</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#eee;
margin:0;
padding:20px;
}

button{
padding:15px 20px;
margin:8px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.orange{background:orange;color:white}
.blue{background:#3498db;color:white}
.green{background:#2ecc71;color:white}
.red{background:#e74c3c;color:white}

#reader{
width:300px;
margin:20px auto;
}

.square{
width:45px;
height:45px;
font-size:18px;
}
</style>
</head>

<body>

<h2>Parkir Scanner</h2>

<div id="defaultMenu">
<button class="orange" id="btnScan">Start Scanning</button>
<button class="blue" id="btnManual">Ketik Manual</button>
<button id="btnLogin">Login Admin</button>
</div>

<div id="reader" style="display:none"></div>

<div id="manualBox" style="display:none">
Parkir-<input id="manualInput" maxlength="3" size="3">
<button class="green square" id="manualOK">✓</button>
<button class="red square" id="manualCancel">×</button>
</div>

<div id="resultBox"></div>

<div id="loginBox" style="display:none">
<br>
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button id="loginSubmit">Login</button>
<button class="red" id="loginCancel">Batal</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const supabase = window.supabase.createClient(
"https://ktpvkmmuugjcoscxbfja.supabase.co",
"sb_publishable_1SJL-5yxWSAC3osTXiEdMw_3Q-060K2"
);

let scanner;

document.getElementById("btnScan").onclick = startScan;
document.getElementById("btnManual").onclick = showManual;
document.getElementById("btnLogin").onclick = showLogin;
document.getElementById("manualCancel").onclick = cancelManual;
document.getElementById("manualOK").onclick = manualOK;
document.getElementById("loginCancel").onclick = cancelLogin;

function startScan(){
document.getElementById("reader").style.display="block"
scanner = new Html5Qrcode("reader");
scanner.start(
{ facingMode:"environment" },
{ fps:10, qrbox:250 },
onScan
);
}

function showManual(){
document.getElementById("manualBox").style.display="block"
}

function cancelManual(){
document.getElementById("manualBox").style.display="none"
}

function manualOK(){
let code = "Parkir-" + document.getElementById("manualInput").value
onScan(code)
}

async function onScan(text){

if(!text.startsWith("Parkir-")) return

let kode = text

const { data } = await supabase
.from('parkir')
.select('*')
.eq('kode',kode)
.eq('status','on')
.single()

if(!data){

document.getElementById("resultBox").innerHTML = `
<h3>${kode}</h3>
<button class="green" onclick="checkin('${kode}')">CHECK-IN</button>
`

}else{

let start = new Date(data.checkin_at)
let now = new Date()
let diff = Math.floor((now-start)/86400000)+1

document.getElementById("resultBox").innerHTML = `
<h3>${kode}</h3>
Mulai: ${start.toLocaleString('id-ID')}
<br>Durasi: ${diff} Hari
<br><br>
<button class="orange" onclick="checkout('${kode}')">Checkout</button>
<button class="red" onclick="cancelParkir('${kode}')">Batal Parkir</button>
`

}

}

window.checkin = async function(kode){
await supabase.from('parkir').insert({
kode:kode,
status:'on',
checkin_at:new Date()
})
alert("Check-in sukses")
location.reload()
}

window.checkout = async function(kode){
await supabase.from('parkir')
.update({status:'off',checkout_at:new Date()})
.eq('kode',kode)
.eq('status','on')
alert("Checkout sukses")
location.reload()
}

window.cancelParkir = async function(kode){
await supabase.from('parkir')
.delete()
.eq('kode',kode)
.eq('status','on')
alert("Dibatalkan")
location.reload()
}

function showLogin(){
document.getElementById("loginBox").style.display="block"
}

function cancelLogin(){
document.getElementById("loginBox").style.display="none"
}

});
</script>

</body>
</html>
