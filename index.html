<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parkir</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#eee;
margin:0;
padding:20px;
}

button{
padding:15px 20px;
margin:8px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.orange{background:orange;color:white}
.blue{background:#3498db;color:white}
.green{background:#2ecc71;color:white}
.red{background:#e74c3c;color:white}

#reader{
width:300px;
margin:20px auto;
}

.square{
width:45px;
height:45px;
font-size:18px;
}
</style>
</head>

<body>

<h2>Parkir Scanner</h2>

<div id="defaultMenu">
<button class="orange" id="btnScan">Start Scanning</button>
<button class="blue" id="btnManual">Ketik Manual</button>
<button class="blue" id="btnLogin">Login Admin</button>
</div>

<div id="reader" style="display:none"></div>

<div id="scanControl" style="display:none">
<button class="red" id="btnStop">Stop Scanning</button>
<button class="blue" id="btnSwitch">Switch Kamera</button>
</div>

<div id="manualBox" style="display:none; margin-top:15px;">
<div style="font-size:18px; margin-bottom:10px;">Parkir-</div>

<input id="manualInput"
maxlength="3"
inputmode="numeric"
pattern="[0-9]*"
style="
width:120px;
height:50px;
font-size:24px;
text-align:center;
border-radius:12px;
border:2px solid #ccc;
margin-right:10px;
">

<button class="green square" id="manualOK">✓</button>
<button class="red square" id="manualCancel">×</button>
</div>

<div id="resultBox"></div>

<div id="loginBox" style="display:none">
<br>
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button id="loginSubmit">Login</button>
<button class="red" id="loginCancel">Batal</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const supabase = window.supabase.createClient(
"https://ktpvkmmuugjcoscxbfja.supabase.co",
"sb_publishable_1SJL-5yxWSAC3osTXiEdMw_3Q-060K2"
);

let scanner;
let currentCamera = "environment";
let scanLocked = false;

document.getElementById("btnScan").onclick = startScan;
document.getElementById("btnManual").onclick = showManual;
document.getElementById("btnLogin").onclick = showLogin;
document.getElementById("manualCancel").onclick = cancelManual;
document.getElementById("manualOK").onclick = manualOK;
document.getElementById("loginCancel").onclick = cancelLogin;
document.getElementById("btnStop").onclick = stopScan;
document.getElementById("btnSwitch").onclick = switchCamera;

function startScan(){
document.getElementById("reader").style.display="block"
document.getElementById("scanControl").style.display="block"
document.getElementById("btnScan").style.display="none"

scanner = new Html5Qrcode("reader");
scanner.start(
{ facingMode:currentCamera },
{ fps:10, qrbox:250 },
onScan
);
}

function stopScan(){
if(scanner){
scanner.stop();
document.getElementById("reader").style.display="none";
document.getElementById("scanControl").style.display="none";
document.getElementById("btnScan").style.display="inline-block";
}
}

function switchCamera(){

if(currentCamera=="environment"){
currentCamera="user"
}else{
currentCamera="environment"
}

scanner.stop().then(()=>{
scanner.start(
{ facingMode:currentCamera },
{ fps:10, qrbox:250 },
onScan
);
})

}

function showManual(){
document.getElementById("manualBox").style.display="block"
document.getElementById("manualInput").focus()
document.getElementById("manualInput").value=""
scanLocked = false;
}

function cancelManual(){
document.getElementById("manualBox").style.display="none"
document.getElementById("manualInput").value=""
scanLocked = false;
}

function manualOK(){
let input = document.getElementById("manualInput").value

if(input.length !== 3){
alert("Masukkan 3 digit angka")
return
}

let code = "Parkir-" + input

document.getElementById("manualBox").style.display="none"
document.getElementById("manualInput").value=""

scanLocked = false;

onScan(code)
}

async function onScan(text){

if(scanLocked) return;
if(!text.startsWith("Parkir-")) return;

scanLocked = true;

if(scanner){
await scanner.stop();
document.getElementById("reader").style.display="none";
document.getElementById("scanControl").style.display="none";
document.getElementById("btnScan").style.display="inline-block";
}

let kode = text

const { data, error } = await supabase
.from('parkir')
.select('*')
.eq('kode',kode)
.eq('status','on')
.maybeSingle()

if(!data){

document.getElementById("resultBox").innerHTML = `
<h3>${kode}</h3>
<button class="green" onclick="checkin('${kode}')">CHECK-IN</button>
<br><br>
<button class="blue" onclick="scanUlang()">Scan Lagi</button>
`
setTimeout(()=> scanLocked=false, 2000);

}else{

let start = new Date(data.checkin_at)
let now = new Date()

// WIB conversion
let wibNow = new Date(now.toLocaleString("en-US", {timeZone:"Asia/Jakarta"}))
let wibStart = new Date(start.toLocaleString("en-US", {timeZone:"Asia/Jakarta"}))

let hour = wibStart.getHours()

let durasi = 1


if(hour >= 21){
let tomorrow = new Date(wibStart)
tomorrow.setDate(tomorrow.getDate()+1)
tomorrow.setHours(0,0,0)

let diff = Math.floor((wibNow - tomorrow)/86400000)

if(wibNow.getHours() <= 6){
durasi = 1
}else{
durasi = diff+2
}

}else{
let diff = Math.floor((wibNow - wibStart)/86400000)
durasi = diff+1
}
let tarif = durasi * 3000

document.getElementById("resultBox").innerHTML = `
<h3>${kode}</h3>
Mulai: ${wibStart.toLocaleString('id-ID')}
<br>Durasi: ${durasi} Hari
<br>Tarif: Rp ${tarif.toLocaleString('id-ID')}
<br><br>
<button class="orange" onclick="checkout('${kode}')">Checkout</button>
<button class="red" onclick="cancelParkir('${kode}')">Batal Parkir</button>
<br><br>
<button class="blue" onclick="scanUlang()">Scan Lagi</button>
`

}

}

window.checkin = async function(kode){
await supabase.from('parkir').insert({
kode:kode,
status:'on',
checkin_at:new Date()
})
scanLocked = false;
alert("Check-in sukses")
scanUlang()
}

window.checkout = async function(kode){
await supabase.from('parkir')
.update({status:'off',checkout_at:new Date()})
.eq('kode',kode)
.eq('status','on')
scanLocked = false;
alert("Checkout sukses")
scanUlang()
}

window.cancelParkir = async function(kode){

const { data } = await supabase
.from('parkir')
.select('*')
.eq('kode',kode)
.eq('status','on')
.single()

let start = new Date(data.checkin_at)
let wibStart = new Date(start.toLocaleString("en-US", {timeZone:"Asia/Jakarta"}))
let hour = wibStart.getHours()
scanLocked = false;

if(hour < 21){
await supabase
.from('parkir')
.delete()
.eq('kode',kode)
.eq('status','on')

alert("Parkir dibatalkan sebelum aturan malam")
scanUlang()
}else{
alert("Tidak bisa dibatalkan setelah 21:00 WIB")
}

}

function showLogin(){
document.getElementById("loginBox").style.display="block"
}

function cancelLogin(){
document.getElementById("loginBox").style.display="none"
}

function scanUlang(){
document.getElementById("resultBox").innerHTML = ""
scanLocked = false;
startScan();
}

});
</script>

</body>
</html>
