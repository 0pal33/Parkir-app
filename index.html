<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAHAYE PARKIR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#eee;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
text-align:center;
}

/* ===== SPACE ===== */
.top{
padding:15px;
background:white;
font-weight:bold;
}

.middle{
flex:1;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.bottom{
padding:15px;
background:white;
}

/* ===== BUTTON ===== */
button{
padding:15px 20px;
margin:6px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.orange{background:orange;color:white}
.blue{background:#3498db;color:white}
.red{background:#e74c3c;color:white}
.green{background:#2ecc71;color:white}

#reader{
width:300px;
}

input{
width:120px;
height:50px;
font-size:24px;
text-align:center;
border-radius:12px;
border:2px solid #ccc;
}
</style>
</head>

<body>

<!-- ===== TOP ===== -->
<div class="top">
Selamat datang di layanan WAHAYE PARKIR
</div>

<!-- ===== MIDDLE ===== -->
<div class="middle">

<div id="reader" style="display:none"></div>

<div id="manualBox" style="display:none">
Parkir-<br><br>
<input id="manualInput" maxlength="3">
<br><br>
<button class="green" onclick="manualOK()">✓</button>
</div>

<div id="resultBox"></div>

</div>

<!-- ===== BOTTOM ===== -->
<div class="bottom" id="bottomButtons"></div>

<script>
let scanner;
let scanLocked=false;
let currentCamera="environment";

/* ===== BUTTON STATE ===== */

function showHome(){
hideAll();
document.getElementById("bottomButtons").innerHTML=`
<button class="orange" onclick="startScan()">Start Scanning</button>
<button class="blue" onclick="showManual()">Ketik Manual</button>
<button class="blue" onclick="goAdmin()">Login Admin</button>
`;
}

function showScan(){
hideAll();
document.getElementById("reader").style.display="block";
document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="stopScan()">Stop</button>
`;
}

function showResult(){
document.getElementById("bottomButtons").innerHTML=`
<button class="orange" onclick="scanUlang()">Scan Ulang</button>
<button class="blue" onclick="manualAgain()">Ketik Lagi</button>
`;
}

function showManualState(){
hideAll();
document.getElementById("manualBox").style.display="block";
document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="cancelManual()">Batal</button>
`;
}

function hideAll(){
document.getElementById("reader").style.display="none";
document.getElementById("manualBox").style.display="none";
document.getElementById("resultBox").innerHTML="";
}

/* ===== NAV ===== */

window.goAdmin=function(){
window.location.href="admin.html"
}

/* ===== SCAN ===== */

window.startScan=function(){

showScan();

scanner=new Html5Qrcode("reader");
scanner.start(
{facingMode:currentCamera},
{fps:10,qrbox:250},
onScan
);
}

window.stopScan=function(){
if(scanner){
scanner.stop();
}
showHome();
}

/* ===== MANUAL ===== */

window.showManual=function(){
showManualState();
}

window.cancelManual=function(){
showHome();
}

window.manualAgain=function(){
showManualState();
}

window.manualOK=function(){

let val=document.getElementById("manualInput").value;
if(val.length!==3){
alert("3 digit");
return;
}

onScan("Parkir-"+val);
}

/* ===== SCAN RESULT ===== */

async function onScan(text){

if(scanLocked) return;
if(!text.startsWith("Parkir-")) return;

scanLocked=true;

if(scanner){
await scanner.stop();
}

hideAll();

let kode=text;

const {data}=await supabase
.from('parkir')
.select('*')
.eq('kode',kode)
.eq('status','on')
.maybeSingle();

if(!data){

document.getElementById("resultBox").innerHTML=`
<h3>${kode}</h3>
<button class="green" onclick="checkin('${kode}')">CHECK-IN</button>
`;

showResult();
scanLocked=false;
return;
}

/* ===== DURASI BARU ===== */

let start=new Date(data.checkin_at);
let now=new Date();

let wStart=new Date(start.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));
let wNow=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));

let durasi=1;

let startHour=wStart.getHours();

if(startHour>=21){

if(wNow.getHours()<6){
durasi=1;
}else{
durasi=daysBetween(wStart,wNow)+1;
}

}else{

durasi=daysBetween(wStart,wNow)+1;

}

let tarif=durasi*3000;

document.getElementById("resultBox").innerHTML=`
<h3>${kode}</h3>
Mulai: ${wStart.toLocaleString('id-ID')}
<br>Durasi: ${durasi} Hari
<br>Tarif: Rp ${tarif.toLocaleString('id-ID')}
<br><br>
<button class="orange" onclick="checkout('${kode}')">Checkout</button>
<button class="red" onclick="cancelParkir('${kode}')">Batal Parkir</button>
`;

showResult();
scanLocked=false;
}

/* ===== HITUNG HARI WIB ===== */

function daysBetween(a,b){
let d1=new Date(a.getFullYear(),a.getMonth(),a.getDate());
let d2=new Date(b.getFullYear(),b.getMonth(),b.getDate());
return Math.floor((d2-d1)/86400000);
}

/* ===== ACTION ===== */

window.scanUlang=function(){
showHome();
}

window.checkin=async function(k){
await supabase.from('parkir').insert({
kode:k,
status:'on',
checkin_at:new Date()
});
alert("Checkin sukses");
showHome();
}

window.checkout=async function(k){
await supabase.from('parkir')
.update({status:'off',checkout_at:new Date()})
.eq('kode',k)
.eq('status','on');

alert("Checkout sukses");
showHome();
}

window.cancelParkir=async function(k){

const {data}=await supabase
.from('parkir')
.select('*')
.eq('kode',k)
.eq('status','on')
.single();

let start=new Date(data.checkin_at);
let wStart=new Date(start.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));

if(wStart.getHours()<21){

await supabase
.from('parkir')
.delete()
.eq('kode',k)
.eq('status','on');

alert("Dibatalkan");

}else{
alert("Tidak bisa dibatalkan setelah 21:00");
}

showHome();
}

showHome();

</script>

</body>
</html>
