<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAHAYE PARKIR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#eee;
margin:0;
display:flex;
flex-direction:column;
min-height:100vh;
text-align:center;
}

/* ===== SPACE ===== */
.top{
padding:15px;
background:white;
font-weight:bold;
}

.middle{
flex:1;
min-height:60vh;
display:flex;
justify-content:flex-start;
align-items:center;
flex-direction:column;
padding-top:20px;
}

.bottom{
padding:20px 15px 40px 15px;
background:white;
}

.logout-btn{
background:#28a745;
color:white;
border:none;
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
transition:all 0.3s ease;
}

.logout-btn:hover{
background:#218838;
transform:scale(1.1);
}

.power-icon{
width:24px;
height:24px;
fill:none;
stroke:white;
stroke-width:2.5;
stroke-linecap:round;
stroke-linejoin:round;
}

/* ===== BUTTON ===== */
button{
padding:15px 20px;
margin:6px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.orange{background:orange;color:white}
.blue{background:#3498db;color:white}
.red{background:#e74c3c;color:white}
.green{background:#2ecc71;color:white}

#reader{
width:300px;
}

input, select{
width:220px;
height:50px;
font-size:16px;
text-align:center;
border-radius:12px;
border:2px solid #ccc;
}
</style>
</head>

<body>

<!-- ===== TOP ===== -->
<div class="top" style="display:flex;align-items:center;justify-content:center;gap:10px">

<button class="logout-btn" onclick="goAdmin()" title="Admin">
  <svg class="power-icon" viewBox="0 0 24 24">
    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
    <line x1="12" y1="2" x2="12" y2="12"></line>
  </svg>
</button>

Selamat datang di layanan WAHAYE PARKIR

</div>

<!-- ===== MIDDLE ===== -->
<div class="middle">

<div id="reader" style="display:none"></div>

<div id="manualBox" style="display:none">
Parkir-<br><br>
<input id="manualInput"
maxlength="3"
inputmode="numeric"
pattern="[0-9]*"
type="tel">
<br><br>
<button class="green" onclick="manualOK()">✓</button>
</div>

<div id="resultBox"></div>

</div>

<!-- ===== BOTTOM ===== -->
<div class="bottom" id="bottomButtons"></div>

<script>
let scanner;
let scanLocked=false;
let currentCamera="environment";

/* ===== BUTTON STATE ===== */

/* ===== BULANAN MENU ===== */

function showBulanan(){

hideAll();

document.getElementById("resultBox").innerHTML=`
<h3>Layanan Bulanan</h3>

<button class="green" onclick="formTambah()">Tambah</button>

<button class="orange" onclick="listBayar()">Bayar</button>
`;

document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="showHome()">Kembali</button>
`;

}

/* ===== FORM TAMBAH ===== */

function formTambah(){

hideAll();

document.getElementById("resultBox").innerHTML=`

<h3>Tambah Pelanggan</h3>

<input id="namaBulanan" placeholder="Nama" autocapitalize="words"><br>

<input id="motorBulanan" placeholder="Motornya apa?" autocapitalize="words"><br>

<select id="tempoBulanan" style="width:220px;height:40px;font-size:16px">

<option value="">Tanggal jatuh tempo</option>

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
<option value="13">13</option>
<option value="14">14</option>
<option value="15">15</option>
<option value="16">16</option>
<option value="17">17</option>
<option value="18">18</option>
<option value="19">19</option>
<option value="20">20</option>
<option value="21">21</option>
<option value="22">22</option>
<option value="23">23</option>
<option value="24">24</option>
<option value="25">25</option>
<option value="26">26</option>
<option value="27">27</option>
<option value="28">28</option>
<option value="29">29</option>
<option value="30">30</option>
<option value="31">31</option>

</select><br><br><br>

<button class="green" onclick="simpanBulanan()">Simpan</button>

`;

document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="showBulanan()">Kembali</button>
`;

}

/* ===== SIMPAN ===== */

async function simpanBulanan(){

let nama=document.getElementById("namaBulanan").value.trim()
let motor=document.getElementById("motorBulanan").value
let tempo=parseInt(document.getElementById("tempoBulanan").value)

if(!nama || !tempo){
alert("Nama dan jatuh tempo wajib")
return
}

if(tempo < 1 || tempo > 31){
alert("Tanggal harus 1 - 31")
return
}

const { error } = await supabase.from('bulanan').insert({

nama:nama,
motor:motor,
jatuh_tempo:tempo,
status:'aktif'

})

if(error){
alert("Gagal simpan: "+error.message)
return
}

alert("Pelanggan berhasil ditambah")

document.getElementById("namaBulanan").value=""
document.getElementById("motorBulanan").value=""
document.getElementById("tempoBulanan").value=""

showBulanan()

}

/* ===== LIST BAYAR ===== */

async function listBayar(){

hideAll();

document.getElementById("resultBox").innerHTML="Loading..."

const {data}=await supabase
.from('bulanan')
.select('*')
.eq('status','aktif')
.order('jatuh_tempo')

let html="<h3>Daftar Pelanggan ("+(data ? data.length : 0)+")</h3>"

if(!data || data.length===0){
document.getElementById("resultBox").innerHTML="<h3>Belum ada pelanggan</h3>";

document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="showBulanan()">Kembali</button>
`;

return;
}

data.forEach(p=>{

let expired=false

if(p.paid_until){
let todayDate=new Date()
let paid=new Date(p.paid_until)
if(todayDate>paid) expired=true
}

let bg = expired ? "#ffd6d6" : "#ffffff"

html+=`
<div style="
display:flex;
align-items:center;
justify-content:space-between;
margin:8px 10px;
padding:10px;
border:1px solid #ccc;
border-radius:10px;
background:${bg};
font-size:14px
">

<div style="
display:flex;
gap:12px;
align-items:center;
font-size:14px
">

<b style="min-width:80px">${p.nama}</b>

<span style="min-width:80px">
${p.motor || "-"}
</span>

<span>
JT:${p.jatuh_tempo}
</span>

</div>

<button class="green"
style="padding:6px 14px;font-size:13px"
onclick="bayarBulanan('${p.id}')">
Bayar
</button>

</div>
`

})

document.getElementById("resultBox").innerHTML=html

document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="showBulanan()">Kembali</button>
`

}

/* ===== BAYAR ===== */

async function bayarBulanan(id){

if(!confirm("Konfirmasi pembayaran pelanggan ini?")){
return
}

const today = new Date()

const nextMonth = new Date(today)
nextMonth.setMonth(today.getMonth()+1)
nextMonth.setDate(today.getDate())

const {error}=await supabase
.from('bulanan')
.update({
paid_until:nextMonth,
last_paid_at:new Date()
})
.eq('id',id)

if(error){
alert("Gagal bayar")
return
}

alert("Pembayaran berhasil sampai "+nextMonth.toLocaleDateString())

listBayar()

}

function showHome(){

hideAll();

document.getElementById("bottomButtons").innerHTML=`
<button class="orange" onclick="startScan()">Start Scanning</button>
<button class="blue" onclick="showManual()">Ketik Manual</button>
<button class="green" onclick="showBulanan()">Bulanan</button>
`;

loadReminder();

}

function showScan(){
hideAll();
document.getElementById("reader").style.display="block";
document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="stopScan()">Stop</button>
`;
}

function showResult(){
document.getElementById("bottomButtons").innerHTML=`
<button class="orange" onclick="scanUlang()">Scan Ulang</button>
<button class="blue" onclick="manualAgain()">Ketik Lagi</button>
`;
}

function showManualState(){
hideAll();
document.getElementById("manualBox").style.display="block";
document.getElementById("bottomButtons").innerHTML=`
<button class="red" onclick="cancelManual()">Batal</button>
`;
}

function hideAll(){
document.getElementById("reader").style.display="none";
document.getElementById("manualBox").style.display="none";
document.getElementById("resultBox").innerHTML="";
}

async function loadReminder(){

if(!document.getElementById("bottomButtons").innerHTML.includes("Start Scanning")){
return
}

const {data}=await supabase
.from('bulanan')
.select('*')
.eq('status','aktif')

if(!data) return

let now = new Date()
let today = now.getDate()
let month = now.getMonth()
let year = now.getFullYear()

let lastDay = new Date(year, month + 1, 0).getDate()

let html=""

data.forEach(p=>{

let expired=false

if(p.paid_until){
let todayDate=new Date()
let paid=new Date(p.paid_until)
if(todayDate>paid) expired=true
}

let tempo = p.jatuh_tempo

let jatuhTempo = tempo

if(tempo > lastDay){
jatuhTempo = lastDay
}

let diff = jatuhTempo - today

if(diff < 0){

let nextMonthLastDay = new Date(year, month + 2, 0).getDate()

let nextTempo = tempo

if(tempo > nextMonthLastDay){
nextTempo = nextMonthLastDay
}

diff = (lastDay - today) + nextTempo
}

if(diff <=5){

let text=""

if(diff===0) text="Hari ini"
else if(diff===1) text="Besok"
else text=diff+" hari lagi"

html+=`
<div style="
background:#fff3cd;
padding:10px;
margin:6px;
border-radius:10px;
font-size:14px
">
⚠ <b>${p.nama}</b><br>
Jatuh tempo ${text}
</div>
`

}

})

if(html !== ""){
document.getElementById("resultBox").innerHTML = `
<h3>Reminder Pembayaran</h3>
${html}
`
}else{
document.getElementById("resultBox").innerHTML = `
<div style="color:#777;font-size:14px">
Tidak ada pembayaran yang mendekati jatuh tempo
</div>
`
}
}

/* ===== NAV ===== */

window.goAdmin=function(){
window.location.href="admin.html"
}

/* ===== SCAN ===== */

window.startScan=async function(){

showScan();

if(scanner){
await scanner.stop().catch(()=>{});
scanner.clear();
scanner = null;
}

scanner=new Html5Qrcode("reader");
scanner.start(
{facingMode:currentCamera},
{
fps:10,
qrbox:250,
focusMode:"continuous"
},
onScan
);
}

window.stopScan = async function(){
if(scanner){
await scanner.stop().catch(()=>{});
scanner.clear();
scanner = null;
}
showHome();
}

/* ===== MANUAL ===== */

window.showManual=function(){
showManualState();
document.getElementById("manualInput").value="";
document.getElementById("manualInput").focus();
scanLocked=false;
}

window.cancelManual=function(){
showHome();
}

window.manualAgain=function(){
showManualState();
}

window.manualOK=function(){

let val=document.getElementById("manualInput").value.replace(/\D/g,'');
if(val.length!==3){
alert("3 digit");
return;
}

document.getElementById("manualInput").value="";
scanLocked=false;
onScan("Parkir-"+val);
}

/* ===== SCAN RESULT ===== */

async function onScan(text){

if(scanLocked) return;
if(!text.startsWith("Parkir-")) return;

scanLocked=true;

if(scanner){
await scanner.stop().catch(()=>{});
scanner.clear();
scanner = null;
}

hideAll();

document.getElementById("resultBox").innerHTML="Memproses...";

let kode=text;

const {data,error}=await supabase
.from('parkir')
.select('*')
.eq('kode',kode)
.eq('status','on')
.maybeSingle();

if(error){
document.getElementById("resultBox").innerHTML="Koneksi bermasalah";
scanLocked=false;
return;
}

if(!data){

document.getElementById("resultBox").innerHTML=`

<div style="font-size:32px;font-weight:bold;margin-bottom:20px">
${kode}
</div>

<button class="green"
style="font-size:22px;padding:20px;width:260px"
onclick="checkin('${kode}')">

CHECK-IN

</button>
`;

showResult();
scanLocked=false;
return;
}

/* ===== DURASI BARU ===== */

let start=new Date(data.checkin_at);
let now=new Date();

let wStart=new Date(start.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));
let wNow=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));

let durasi = hitungDurasiWAHAYE(wStart, wNow);
let tarif = durasi * 3000;

document.getElementById("resultBox").innerHTML=`

<div style="font-size:32px;font-weight:bold;margin-bottom:10px">
${kode}
</div>

<div style="font-size:18px;margin-bottom:5px">
Mulai: ${wStart.toLocaleString('id-ID')}
</div>

<div style="font-size:22px;font-weight:bold">
Durasi: ${durasi} Hari
</div>

<div style="font-size:26px;font-weight:bold;color:#e67e22;margin:10px 0">
Rp ${tarif.toLocaleString('id-ID')}
</div>

<div style="width:90%;max-width:420px">

<button class="orange" style="width:100%;font-size:20px;padding:18px"
onclick="checkout('${kode}')">
Checkout
</button>

<button class="red" style="width:100%;font-size:18px;padding:16px"
onclick="cancelParkir('${kode}')">
Batal Parkir
</button>

</div>
`;

showResult();
scanLocked=false;
}

/* ===== HITUNG HARI WIB ===== */

function daysBetween(a,b){
let d1=new Date(a.getFullYear(),a.getMonth(),a.getDate());
let d2=new Date(b.getFullYear(),b.getMonth(),b.getDate());
return Math.floor((d2-d1)/86400000);
}

/* ===== HELPER WAHAYE ===== */

function hitungDurasiWAHAYE(wStart, wNow){

let startHour = wStart.getHours();

// ===== MASUK MALAM =====
if(startHour >= 21){

let anchor = new Date(wStart);
anchor.setDate(anchor.getDate()+1);
anchor.setHours(6,0,0,0);

// sebelum 06:00 → masih hari 1
if(wNow < anchor){
return 1;
}

// setelah 06:00 → lanjut normal
let today = new Date(wNow.getFullYear(), wNow.getMonth(), wNow.getDate());
let base  = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());

let diff = Math.floor((today-base)/86400000);

return diff + 2;
}

// ===== MASUK NORMAL =====
else{

let today = new Date(wNow.getFullYear(), wNow.getMonth(), wNow.getDate());
let base  = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate());

let diff = Math.floor((today-base)/86400000);

return diff + 1;
}

}

/* ===== ACTION ===== */

window.scanUlang = async function(){
scanLocked=false;

if(scanner){
await scanner.stop().catch(()=>{});
scanner.clear();
scanner = null;
}

startScan();
}

window.checkin=async function(k){

const { error } = await supabase.from('parkir').insert({
kode:k,
status:'on',
checkin_at:new Date()
});

if(error){
alert("Gagal checkin");
return;
}

hideAll();

document.getElementById("resultBox").innerHTML = `
<div style="
font-size:20px;
font-weight:bold;
color:#2ecc71;
">
Checkin berhasil ✓
</div>
`;

document.getElementById("bottomButtons").innerHTML=`
<button class="orange" onclick="scanUlang()">Scan Ulang</button>
<button class="blue" onclick="showManual()">Ketik Manual</button>
<button class="green" onclick="showBulanan()">Bulanan</button>
`;

scanLocked=false;
}

window.checkout=async function(k){
const { error } = await supabase.from('parkir')
.update({status:'off',checkout_at:new Date()})
.eq('kode',k)
.eq('status','on');

if(error){
alert("Gagal checkout");
return;
}

scanLocked=false;
await onScan(k);
}

window.cancelParkir=async function(k){

const {data,error}=await supabase
.from('parkir')
.select('*')
.eq('kode',k)
.eq('status','on')
.maybeSingle();

if(error){
alert("Koneksi bermasalah");
scanLocked=false;
return;
}

if(!data){
scanLocked=false;
await onScan(k);
return;
}

let start=new Date(data.checkin_at);
let wStart=new Date(start.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));

if(wStart.getHours()<21){

const { error } = await supabase
.from('parkir')
.delete()
.eq('kode',k)
.eq('status','on');

if(error){
alert("Gagal batal parkir");
return;
}

}else{
alert("Tidak bisa dibatalkan setelah 21:00");
}

scanLocked=false;
await onScan(k);
}

const reminderInterval = setInterval(loadReminder,30000)

showHome();

</script>

</body>
</html>
