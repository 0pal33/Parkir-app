<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>WAHAYE PARKIR</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script src="config.js"></script>

<script src="js/parkirEngine.js"></script>
<script src="js/uiSystem.js"></script>
<script src="js/scannerSystem.js"></script>
<script src="js/parkirSystem.js"></script>
<script src="js/bulananSystem.js"></script>
<script src="js/reminderSystem.js"></script>

</head>

<body>

<!-- TOP -->
<div class="top">

<button class="logout-btn" onclick="goAdmin()" title="Admin">

<svg class="power-icon" viewBox="0 0 24 24">
<path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
<line x1="12" y1="2" x2="12" y2="12"></line>
</svg>

</button>

<button id="dashboardBtn" onclick="goDashboard()" title="Dashboard">
📊
</button>

Selamat datang di layanan WAHAYE PARKIR

</div>

<!-- MIDDLE -->
<div class="middle">

<div id="reader" style="display:none">
  <div class="scan-line"></div>
</div>

<button id="switchCamBtn" class="blue" onclick="switchCamera()" style="display:none">
📷 Tukar Kamera
</button>

<div id="manualBox" style="display:none">

Parkir-<br><br>

<input
id="manualInput"
maxlength="3"
inputmode="numeric"
pattern="[0-9]*"
type="tel">

<br><br>

<button class="green" onclick="manualOK()">✓</button>

</div>

<div id="resultBox"></div>

</div>

<!-- BOTTOM -->
<div class="bottom" id="bottomButtons"></div>

<script>

const reminderInterval = setInterval(loadReminder,60000)

showHome()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
