<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#eee;
text-align:center;
padding:20px;
margin:0;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.logout{
background:#e74c3c;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
font-size:14px;
cursor:pointer;
}

.slider{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
gap:15px;
padding-bottom:10px;
}

.card{
flex:0 0 90%;
max-width:400px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
scroll-snap-align:center;
}

.activeCard{
background:white;
padding:20px;
margin:15px auto;
border-radius:15px;
width:90%;
max-width:400px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

</style>
</head>

<body>

<div class="topbar">
<h3>Dashboard</h3>
<div>
<button id="resetBtn" class="orange" style="display:none" onclick="resetData()">Reset Data Test</button>
<button class="red square" onclick="logout()">⏻</button>
</div>
</div>

<!-- SLIDER LAPORAN -->
<div class="slider">

<div class="card">
<h3>Hari Ini</h3>
<p>Checkout: <span id="d1">0</span></p>
<p>Total: Rp <span id="t1">0</span></p>
</div>

<div class="card">
<h3>Minggu Ini</h3>
<p>Checkout: <span id="d2">0</span></p>
<p>Total: Rp <span id="t2">0</span></p>
</div>

<div class="card">
<h3>Bulan Ini</h3>
<p>Checkout: <span id="d3">0</span></p>
<p>Total: Rp <span id="t3">0</span></p>
</div>

</div>

<!-- PARKIR AKTIF -->
<div class="activeCard">
<h3>Parkir Aktif</h3>
<div id="activeList">Loading...</div>
</div>

<script>

async function loadDashboard(){

const { data: { user } } = await supabase.auth.getUser();

if(user?.email === "fakha3161@gmail.com"){
document.getElementById("resetBtn").style.display = "inline-block";
}

// =================
// PARKIR AKTIF
// =================
const { data: active } = await supabase
.from("parkir")
.select("*")
.eq("status","on")

let html=""

if(active.length === 0){
html="Tidak ada parkir aktif"
}else{
active.forEach(p=>{
html += `
<div style="margin:10px;padding:10px;border:1px solid #ddd;border-radius:10px">
<b>${p.kode}</b><br>
${new Date(p.checkin_at).toLocaleString('id-ID')}
</div>`
})
}

document.getElementById("activeList").innerHTML = html


// =================
// LAPORAN
// =================
const { data: done } = await supabase
.from("parkir")
.select("*")
.eq("status","off")

let today = new Date()
let week = new Date()
week.setDate(today.getDate()-7)

let month = new Date()
month.setMonth(today.getMonth()-1)

let dayCount=0
let weekCount=0
let monthCount=0

done.forEach(p=>{
let t = new Date(p.checkout_at)

if(t.toDateString() === today.toDateString()){
dayCount++
}

if(t >= week){
weekCount++
}

if(t >= month){
monthCount++
}
})

document.getElementById("d1").innerText = dayCount
document.getElementById("d2").innerText = weekCount
document.getElementById("d3").innerText = monthCount

document.getElementById("t1").innerText = (dayCount*3000).toLocaleString('id-ID')
document.getElementById("t2").innerText = (weekCount*3000).toLocaleString('id-ID')
document.getElementById("t3").innerText = (monthCount*3000).toLocaleString('id-ID')

}

async function logout(){
await supabase.auth.signOut()
window.location.href="admin.html"
}

loadDashboard()

async function resetData(){

if(!confirm("Yakin hapus semua data parkir?")){
return;
}

const { error } = await supabase
.from("parkir")
.delete()
.neq("kode","");

if(error){
alert("Gagal reset data");
return;
}

alert("Data test berhasil dihapus");
location.reload();
}

</script>

</body>
</html>
