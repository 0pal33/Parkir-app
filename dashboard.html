<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/parkirEngine.js"></script>

<style>
body{display:none}
</style>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
text-align:center;
padding-bottom:100px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout{
background:#ff4757;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.topButtons{
display:flex;
gap:8px;
}

.petugasBtn{
background:#95a5a6;
color:white;
border:none;
padding:10px 12px;
border-radius:10px;
cursor:pointer;
font-size:16px;
opacity:0.6;
}

.petugasBtn:hover{
opacity:1;
}

.slider{
max-width:520px;
margin:auto;
overflow:hidden;
}

.slides{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
gap:15px;
-webkit-overflow-scrolling:touch;
scroll-snap-stop:always;
scroll-padding-left:0;
touch-action: pan-x;
}

.slides::-webkit-scrollbar{
display:none;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);

min-width:95%;
flex-shrink:0;
scroll-snap-align:start;
}

.menu{
max-width:520px;
margin:20px auto 0 auto;
display:flex;
flex-direction:column;
gap:10px;
}

.big{
font-size:26px;
font-weight:bold;
margin-top:10px;
}

.btn{
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.dots{
margin-top:10px;
display:flex;
justify-content:center;
gap:6px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#ccc;
}

.dot.active{
background:#3498db;
}

.blue{background:#3498db;color:white}
.green{background:#2ecc71;color:white}
.red{background:#e74c3c;color:white}

#floatingPetugas{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
border:none;
background:#2ecc71;
color:white;
font-size:28px;
box-shadow:0 6px 15px rgba(0,0,0,0.3);
cursor:pointer;
z-index:999;
}

#floatingPetugas:active{
transform:translateX(-50%) scale(0.9);
}

</style>
</head>

<body>

<script>
(async ()=>{

if(localStorage.getItem("adminLogin") !== "true"){
window.location.replace("index.html")
return
}

const { data } = await window.supabaseClient.auth.getSession()

if(!data.session){
window.location.replace("index.html")
return
}

document.body.style.display="block"

})()
</script>

<div class="top">

<h3>Dashboard Admin</h3>

<div class="topButtons">


</div>

</div>

<div class="slider">

  <button id="periodBtn" class="blue btn" style="margin-bottom:10px">Hari ini 
  </button>

  <input id="filterTanggal" style="display:none">

  <div class="card">

    <div>Total :</div>
    <div class="big" id="grandTotal">Rp 0</div>

    <hr>

    <div style="display:flex;justify-content:space-between">

      <div>
        Pendapatan :
        <div id="incomeTotal">Rp 0</div>
      </div>

      <div>
        Pengeluaran :
        <div id="expenseTotal">Rp 0</div>
      </div>

    </div>

  </div>

</div>

<div id="titipanAktifBox" class="card" style="margin-top:15px">
  <b>Barang Titipan Aktif (di warung)</b>
  <div id="titipanAktifList">Loading...</div>
</div>

<div class="menu" id="menuContainer">

<button class="blue btn" onclick="window.location='parkirAktif.html'">
Lihat Parkir Aktif
</button>

<button class="green btn" onclick="window.location='titipan.html'">
Titipan Warung
</button>

<button class="blue btn" onclick="toggleDetail()">Detail</button>

<div id="detailBox" style="display:none"></div>

</div>

<script>

let dashboardInterval = null
let selectedDates = []
let isCustom = false

function rupiah(n){
n = Number(n) || 0
return "Rp " + n.toLocaleString('id-ID')
}

function isSameDay(a,b){
return a.getFullYear()===b.getFullYear() &&
       a.getMonth()===b.getMonth() &&
       a.getDate()===b.getDate()
}
  
function nowWIB(){
return new Date(
new Date().toLocaleString("en-US",{timeZone:"Asia/Jakarta"})
)
}

async function loadDashboard(){

const setLoading = ()=>{
  ["grandTotal","incomeTotal","expenseTotal"].forEach(id=>{
    let el = document.getElementById(id)
    if(el) el.style.opacity = 0.5
  })
}

const clearLoading = ()=>{
  ["grandTotal","incomeTotal","expenseTotal"].forEach(id=>{
    let el = document.getElementById(id)
    if(el) el.style.opacity = 1
  })
}

setLoading()

let today = nowWIB()

let start, end

if(!isCustom || selectedDates.length === 0){
  start = new Date(today)
  start.setHours(0,0,0,0)

  end = new Date(today)
  end.setHours(23,59,59,999)

}else{
  start = new Date(selectedDates[0])
  start.setHours(0,0,0,0)

  end = new Date(selectedDates[1] || selectedDates[0])
  end.setHours(23,59,59,999)
}

let startISO = start.toISOString()
let endISO = end.toISOString()

// =====================
// FETCH DATA
// =====================

let {data:parkir} = await window.supabaseClient
.from("parkir")
.select("checkout_at, checkin_at")
.eq("status","off")
.gte("checkout_at", startISO)
.lte("checkout_at", endISO)

let {data:bulanan} = await window.supabaseClient
.from("bulanan")
.select("last_paid_at, last_paid_amount")
.gte("last_paid_at", startISO)
.lte("last_paid_at", endISO)

let {data:stok} = await window.supabaseClient
.from("stok_log")
.select("*")
.gte("created_at", startISO)
.lte("created_at", endISO)

let {data:titipan} = await window.supabaseClient
.from("titipan_log")
.select("*")
.gte("created_at", startISO)
.lte("created_at", endISO)

// =====================
// HITUNG
// =====================

let income = 0
let expense = 0

// parkir
;(parkir||[]).forEach(p=>{
let tOut = new Date(p.checkout_at)
let tIn = new Date(p.checkin_at)

let durasi = hitungDurasiParkir(tIn, tOut)
let tarif = hitungTarifParkir(durasi)

income += tarif
})

// bulanan
;(bulanan||[]).forEach(b=>{
if(b.last_paid_amount){
  income += Number(b.last_paid_amount)
}
})

// stok
;(stok||[]).forEach(s=>{
if(s.jenis==="jual") income += Number(s.total||0)
if(s.jenis==="pesan") expense += Number(s.total||0)
})

// titipan (sesuaikan kalau beda)
;(titipan||[]).forEach(t=>{
let total = Number(t.total || 0)

if(t.jenis==="ambil"){
  income += total          // uang masuk
  expense += total         // uang ke penitip
}
})

// =====================
// RENDER
// =====================

document.getElementById("incomeTotal").innerText = rupiah(income)
document.getElementById("expenseTotal").innerText = rupiah(expense)
document.getElementById("grandTotal").innerText = rupiah(income - expense)

document.getElementById("periodBtn").innerText = formatLabel()

await loadTitipanAktif()

clearLoading()

}

async function logout(){

await window.supabaseClient.auth.signOut()

localStorage.removeItem("adminLogin")

window.location.replace("admin.html")

}

async function resetData(){

let konfirmasi = prompt("Ketik RESET")

if(konfirmasi !== "RESET") return

try{

/* parkir */
await window.supabaseClient
.from("parkir")
.delete()
.neq("kode","")

/* bulanan */
await window.supabaseClient
.from("bulanan")
.delete()
.neq("nama","")

/* stok barang */
await window.supabaseClient
.from("stok_barang")
.delete()
.neq("nama_item","")

/* log stok */
await window.supabaseClient
.from("stok_log")
.delete()
.gt("qty",-1)

/* barang titipan */
await window.supabaseClient
.from("barang_titipan")
.delete()
.neq("nama_item","")

/* log titipan */
await window.supabaseClient
.from("titipan_log")
.delete()
.gt("qty",-1)

alert("SEMUA DATA TEST BERHASIL DIRESET")

location.reload()

}catch(err){

alert("Gagal reset: " + err.message)
console.log(err)

}

}

function goPetugas(){
window.location.href="index.html"
}

function formatLabel(){
  if(!isCustom || selectedDates.length === 0){
    return "Hari ini"
  }

  let a = selectedDates[0]
  let b = selectedDates[1] || a

  const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"]

  let d1 = a.getDate()
  let m1 = bulan[a.getMonth()]
  let y1 = String(a.getFullYear()).slice(-2)

  let d2 = b.getDate()
  let m2 = bulan[b.getMonth()]
  let y2 = String(b.getFullYear()).slice(-2)

  if(a.getTime() === b.getTime()){
    return `${d1} ${m1} ${y1}`
  }

  if(a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()){
    return `${d1} - ${d2} ${m2} ${y2}`
  }

  if(a.getFullYear() === b.getFullYear()){
    return `${d1} ${m1} - ${d2} ${m2} ${y2}`
  }

  return `${d1} ${m1} ${y1} - ${d2} ${m2} ${y2}`
}

async function loadTitipanAktif(){

let {data,error} = await window.supabaseClient
.from("barang_titipan")
.select("nama_item, qty")
.gt("qty", 0)
.order("nama_item")

if(error){
document.getElementById("titipanAktifList").innerText = "Gagal load"
return
}

if(!data || data.length === 0){
document.getElementById("titipanAktifList").innerText = "Kosong"
return
}

let html = ""

data.forEach(i=>{
html += `
<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee">
<span>${i.nama_item}</span>
<b>${i.qty}</b>
</div>
`
})

document.getElementById("titipanAktifList").innerHTML = html

}

function toggleDetail(){
  let box = document.getElementById("detailBox")

  if(box.style.display === "none"){
    box.style.display = "block"

    box.innerHTML = `
      <div class="card" style="margin-top:10px">
        <button class="blue btn" onclick="window.location='parkirAktif.html'">
        Lihat Parkir Aktif
        </button>

        <button class="green btn" onclick="window.location='titipan.html'">
        Kelola Titipan
        </button>
      </div>
    `
  }else{
    box.style.display = "none"
  }
}

window.onload = () => {

if(dashboardInterval !== null){
  clearInterval(dashboardInterval)
}

setTimeout(()=>{
  if(typeof loadDashboard === "function"){
    loadDashboard()
    if(!isCustom){
  if(dashboardInterval){
  clearInterval(dashboardInterval)
}

dashboardInterval = setInterval(loadDashboard,10000)
}
  }else{
    console.log("loadDashboard belum siap")
  }
}, 500)

if(IS_DEV){
  const btn = document.createElement("button")
  btn.className = "red btn"
  btn.innerText = "Reset Data Test"
  btn.onclick = resetData

  document.getElementById("menuContainer").appendChild(btn)
}

};


window.addEventListener("beforeunload",()=>{
if(dashboardInterval !== null){
clearInterval(dashboardInterval)
}
})

</script>

<button id="floatingPetugas" onclick="goPetugas()">👨‍🔧</button>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const fp = flatpickr("#filterTanggal", {
  mode: "range",
  dateFormat: "Y-m-d",
  onChange: function(dates){
  if(dates.length === 0){
  isCustom = false
  selectedDates = []

  if(dashboardInterval){
  clearInterval(dashboardInterval)
}

dashboardInterval = setInterval(loadDashboard,10000)

  loadDashboard()
  return
}

  selectedDates = dates
isCustom = true

if(dashboardInterval){
  clearInterval(dashboardInterval)
}

loadDashboard()
}
})

document.getElementById("periodBtn").onclick = ()=>{
  fp.open()
}

})

</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
