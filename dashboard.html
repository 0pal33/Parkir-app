<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store" />
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

// cek login lokal
const user = localStorage.getItem("adminLogin");

if(!user){
window.location.href = "admin.html";
}

// cek session supabase
async function checkSession(){

const { data:{session} } = await supabase.auth.getSession()

if(!session){
localStorage.removeItem("adminLogin")
window.location.href="admin.html"
}

}

checkSession()

</script>

<style>
body{
font-family:Arial;
background:#eee;
text-align:center;
padding:20px;
margin:0;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.logout{
background:#e74c3c;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
font-size:14px;
cursor:pointer;
}

.slider{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
gap:15px;
padding-bottom:10px;
}

.card{
flex:0 0 90%;
max-width:400px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
scroll-snap-align:center;
}

.activeCard{
background:white;
padding:20px;
margin:15px auto;
border-radius:15px;
width:90%;
max-width:400px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.duration{
font-size:13px;
color:#555;
}

.duration-danger{
font-size:13px;
color:red;
font-weight:bold;
}

/* RESET BUTTON */
.reset-btn{
background:#f1c40f;
color:black;
border:none;
padding:8px 14px;
border-radius:8px;
font-size:13px;
cursor:pointer;
}

/* LOGOUT POWER BUTTON */
.logout-btn{
background:#ff4757;
border:none;
width:42px;
height:42px;
border-radius:50%;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 10px rgba(255,71,87,0.3);
}

.logout-btn svg{
width:20px;
height:20px;
fill:white;
}

.logout-btn:hover{
background:#ff6b81;
transform:scale(1.08);
}

.logout-btn:active{
transform:scale(0.95);
}

</style>
</head>

<body>

<div class="topbar">

<h3>Dashboard</h3>

<div style="display:flex;gap:10px;align-items:center">

<button id="resetBtn"
class="reset-btn"
style="display:none"
onclick="resetData()">
Reset Data Test
</button>

<button class="logout-btn" onclick="logout()" title="Logout">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V256c0 17.7 14.3 32 32 32s32-14.3 32-32V32zM143.5 120.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C49.7 115.4 16 181.8 16 256c0 132.5 107.5 240 240 240s240-107.5 240-240c0-74.2-33.8-140.6-86.6-184.6c-13.6-11.3-33.8-9.4-45.1 4.1s-9.4 33.8 4.1 45.1c38.9 32.3 63.7 81.2 63.7 135.3c0 97.2-78.8 176-176 176s-176-78.8-176-176c0-54.1 24.7-103 63.7-135.3z"/>
</svg>

</button>

</div>

</div>

<!-- SLIDER LAPORAN -->
<div class="slider">

<div class="card">
<h3>Hari Ini</h3>
<p>Checkout: <span id="d1">0</span></p>
<p>Total: Rp <span id="t1">0</span></p>
</div>

<div class="card">
<h3>Minggu Ini</h3>
<p>Checkout: <span id="d2">0</span></p>
<p>Total: Rp <span id="t2">0</span></p>
</div>

<div class="card">
<h3>Bulan Ini</h3>
<p>Checkout: <span id="d3">0</span></p>
<p>Total: Rp <span id="t3">0</span></p>
</div>

</div>

<!-- PARKIR AKTIF -->
<div class="activeCard">
<h3>Parkir Aktif</h3>
<div id="activeList">Loading...</div>
</div>

<script>

async function loadDashboard(){

const { data: { user } } = await supabase.auth.getUser();

if(user?.email === "fakha3161@gmail.com"){
document.getElementById("resetBtn").style.display = "inline-block";
}

// =================
// PARKIR AKTIF
// =================
const { data: active, error } = await supabase
.from("parkir")
.select("*")
.eq("status","on")
.order("checkin_at",{ascending:true})

if(error){
document.getElementById("activeList").innerText="Gagal memuat data"
return
}

let html=""

if(active.length === 0){
html="Tidak ada parkir aktif"
}else{
active.forEach(p=>{

let start = new Date(p.checkin_at)
let now = new Date()

let durasi = Math.floor((now - start) / 86400000) + 1
let jam = Math.floor((now - start) / 3600000)

let durasiClass = "duration"

if(durasi > 7){
durasiClass = "duration-danger"
}

html += `
<div style="margin:10px;padding:10px;border:1px solid #ddd;border-radius:10px">
<b>${p.kode}</b><br>
${start.toLocaleString('id-ID')}<br>
<span class="${durasiClass}">
Durasi: ${durasi} hari (${jam} jam)
</span>
</div>`
})
}

document.getElementById("activeList").innerHTML = html


// =================
// LAPORAN
// =================
const { data: done } = await supabase
.from("parkir")
.select("*")
.eq("status","off")

let today = new Date()
let week = new Date()
week.setDate(today.getDate()-7)

let month = new Date()
month.setMonth(today.getMonth()-1)

let dayCount=0
let weekCount=0
let monthCount=0

done.forEach(p=>{
let t = new Date(p.checkout_at)

if(t.toDateString() === today.toDateString()){
dayCount++
}

if(t >= week){
weekCount++
}

if(t >= month){
monthCount++
}
})

document.getElementById("d1").innerText = dayCount
document.getElementById("d2").innerText = weekCount
document.getElementById("d3").innerText = monthCount

document.getElementById("t1").innerText = (dayCount*3000).toLocaleString('id-ID')
document.getElementById("t2").innerText = (weekCount*3000).toLocaleString('id-ID')
document.getElementById("t3").innerText = (monthCount*3000).toLocaleString('id-ID')

}

async function logout(){

await supabase.auth.signOut();

localStorage.removeItem("adminLogin");

window.location.href="admin.html";

}

loadDashboard()

setInterval(async ()=>{
await loadDashboard()
},10000)

async function resetData(){

if(!confirm("Yakin hapus semua data parkir?")){
return;
}

const { error } = await supabase
.from("parkir")
.delete()
.neq("kode","");

if(error){
alert("Gagal reset data");
return;
}

alert("Data test berhasil dihapus");
location.reload();
}

</script>

</body>
</html>
