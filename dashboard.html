<style>

html, body{

body{

.modernCard{

.label{

.rowStat{

.stat{

.stat b{

}

.income{

.top{

align-items:center;
margin-bottom:20px;

.logout{

color:white;

padding:10px 15px;

.topButtons{

.petugasBtn{

border:none;
padding:10px 12px;

.slider{

.slides{

gap:15px;

scroll-snap-stop:always;
scroll-padding-left:0;

}

.card{

  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);

}

.menu{
max-width:520px;
margin:20px auto 0 auto;
display:flex;
flex-direction:column;
gap:10px;
}

.big{

font-weight:bold;
margin-top:10px;
}

.btn{
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.dots{
margin-top:10px;
display:flex;
justify-content:center;
gap:6px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#ccc;
}

.dot.active{
background:#3498db;
}

.blue{background:#3498db;color:white}
.green{background:#2ecc71;color:white}
.red{background:#e74c3c;color:white}

#floatingPetugas{

bottom:25px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
border:none;
background:#2ecc71;
color:white;
font-size:28px;
box-shadow:0 6px 15px rgba(0,0,0,0.3);
cursor:pointer;
z-index:999;
}

transform:translateX(-50%) scale(0.9);

/* CONTAINER */
.summary{
  width:100%;
  max-width:420px;
  margin:auto;
  padding:0 2px;

/* TOTAL CARD */
.totalCard{
  margin-bottom:10px;
  padding:16px;
}

.totalCard .big{
  font-size:28px;
}

/* 2 KOLOM */
.rowBox{
  display:flex;
  gap:10px;
  align-items:stretch;
  width:100%;

/* CARD KECIL */
.statCard{
  flex:1;
  min-width:0;
  width:0; /* ⬅️ FIX BIAR GA MELEBAR */

  border-radius:14px;

/* WARNA */
.incomeCard{
  background:#eafaf1;
  color:#27ae60;
  box-shadow:0 3px 10px rgba(39,174,96,0.15);
}

.expenseCard{
  background:#fdecea;
  color:#e74c3c;
  box-shadow:0 3px 10px rgba(231,76,60,0.15);
}

/* FONT */
.label{

}

.statCard .big{

  font-weight:600;
  margin-top:6px;

/* ======================
   HISTORY FULLSCREEN
====================== */

#historyFullscreen{

  inset:0;
  background:#f2f2f2;
  z-index:99999;
  display:none;
  overflow-y:auto;
  padding:20px 12px 120px;

#historyTitle{

.historyDate{

.historyTable td{

  border-bottom:1px solid #f1f1f1;

.historyTable td:last-child,
.historyTable th:last-child{

.historyBackBtn{

  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  border:none;
  border-radius:14px;
  padding:14px 26px;
  background:#e74c3c;
  color:white;
  font-size:16px;
  box-shadow:0 5px 14px rgba(0,0,0,.2);

</style>
</head>

<body>

<script>
(async ()=>{

if(localStorage.getItem("adminLogin") !== "true"){
window.location.replace("index.html")
return
}

const { data } = await window.supabaseClient.auth.getSession()

if(!data.session){
window.location.replace("index.html")
return
}

document.body.style.display="block"

})()
</script>

<div class="top">

<h3>Dashboard Admin</h3>

<div class="topButtons">


</div>

</div>

<div class="slider">

  <button id="periodBtn" class="blue btn" style="margin-bottom:10px">Hari ini 
  </button>

  <input id="filterTanggal" style="display:none">

<div class="summary">

<div id="detailBox" style="display:none"></div>

</div>

<script>

function isSameDay(a,b){
return a.getFullYear()===b.getFullYear() &&
       a.getMonth()===b.getMonth() &&
       a.getDate()===b.getDate()
}

async function logout(){

await window.supabaseClient.auth.signOut()

localStorage.removeItem("adminLogin")

window.location.replace("admin.html")

}

async function resetData(){

let konfirmasi = prompt("Ketik RESET")

if(konfirmasi !== "RESET") return

try{

/* parkir */
await window.supabaseClient
.from("parkir")
.delete()
.neq("kode","")

/* bulanan */
await window.supabaseClient
.from("bulanan")
.delete()
.neq("nama","")

/* stok barang */
await window.supabaseClient
.from("stok_barang")
.delete()
.neq("nama_item","")

/* log stok */
await window.supabaseClient
.from("stok_log")
.delete()
.gt("qty",-1)

/* barang titipan */
await window.supabaseClient
.from("barang_titipan")
.delete()
.neq("nama_item","")

/* log titipan */
await window.supabaseClient
.from("titipan_log")
.delete()
.gt("qty",-1)

alert("SEMUA DATA TEST BERHASIL DIRESET")

location.reload()

}catch(err){

alert("Gagal reset: " + err.message)
console.log(err)

}

}

function goPetugas(){
window.location.href="index.html"
}

function formatLabel(){
  if(!isCustom || selectedDates.length === 0){
    return "Hari ini"
  }

  let a = selectedDates[0]
  let b = selectedDates[1] || a

  const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"]

  let d1 = a.getDate()
  let m1 = bulan[a.getMonth()]
  let y1 = String(a.getFullYear()).slice(-2)

  let d2 = b.getDate()
  let m2 = bulan[b.getMonth()]
  let y2 = String(b.getFullYear()).slice(-2)

  if(a.getTime() === b.getTime()){
    return `${d1} ${m1} ${y1}`
  }

  if(a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()){
    return `${d1} - ${d2} ${m2} ${y2}`
  }

  if(a.getFullYear() === b.getFullYear()){
    return `${d1} ${m1} - ${d2} ${m2} ${y2}`
  }

  return `${d1} ${m1} ${y1} - ${d2} ${m2} ${y2}`
}

async function loadTitipanDetail(btn){

// reset semua button
document.querySelectorAll("#detailBox button").forEach(b=>{
  b.style.opacity = 0.5
})

if(btn){
  btn.style.opacity = 1
}

let el = document.getElementById("titipanDetailList")
el.innerHTML = "Loading..."

let {data,error} = await window.supabaseClient
.from("barang_titipan")
.select("nama_item, qty")
.gt("qty", 0)
.order("nama_item")

if(error){
  el.innerHTML = "Gagal load"
  return
}

if(!data || data.length === 0){
  el.innerHTML = "Kosong"
  return
}

let html = `
<table style="width:100%;border-collapse:collapse;font-size:14px">
<tr style="background:#f5f5f5">
  <th style="text-align:left;padding:6px">Nama</th>
  <th style="text-align:right;padding:6px">Qty</th>
</tr>
`

data.forEach(i=>{
  html += `
  <tr>
    <td style="padding:6px;border-bottom:1px solid #eee">${i.nama_item}</td>
    <td style="padding:6px;text-align:right;border-bottom:1px solid #eee">${i.qty}</td>
  </tr>
  `
})

html += `</table>`

el.innerHTML = html

}

function toggleDetail(){
  let box = document.getElementById("detailBox")

  if(box.style.display === "none"){
    box.style.display = "block"

    box.innerHTML = `
      <div class="card" style="margin-top:10px">

        <button class="blue btn" onclick="window.location='parkirAktif.html'">
          Parkir Aktif
        </button>

        <button class="green btn" onclick="window.location='titipanAktif.html'">
  Barang Titipan Aktif
</button>

        <div id="titipanDetailList" style="margin-top:15px"></div>

      </div>
    `
  }else{
    box.style.display = "none"
  }
}

let rtTimeout

function triggerReload(){
  clearTimeout(rtTimeout)
  rtTimeout = setTimeout(loadDashboard, 300)
}

let realtimeChannel = null

function setupRealtime(){

  if(!window.supabaseClient) return

  // HAPUS channel lama kalau ada
  if(realtimeChannel){
    window.supabaseClient.removeChannel(realtimeChannel)
  }

  realtimeChannel = window.supabaseClient.channel('dashboard-realtime')

  realtimeChannel
  .on('postgres_changes', { event:'*', schema:'public', table:'parkir' }, triggerReload)
  .on('postgres_changes', { event:'*', schema:'public', table:'bulanan' }, triggerReload)
  .on('postgres_changes', { event:'*', schema:'public', table:'stok_log' }, triggerReload)
  .on('postgres_changes', { event:'*', schema:'public', table:'titipan_log' }, triggerReload)
  .subscribe()
}

window.onload = () => {

  setupRealtime()

  if(IS_DEV){
    const btn = document.createElement("button")
    btn.className = "red btn"
    btn.innerText = "Reset Data Test"
    btn.onclick = resetData

    document.getElementById("menuContainer").appendChild(btn)
  }

}

</script>

if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const fp = flatpickr("#filterTanggal", {
  mode: "range",
  dateFormat: "Y-m-d",
  onChange: function(dates){
  if(dates.length === 0){
    window.isCustom = false
    window.selectedDates = []
    refreshDashboard()
    return
  }

  window.selectedDates = dates
  window.isCustom = true
  refreshDashboard()
}
})

document.getElementById("periodBtn").onclick = ()=>{
  fp.open()
}

})

</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>
