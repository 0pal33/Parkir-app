<!DOCTYPE html>
<html>
<head>

<style>
body{display:none}
</style>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
text-align:center;
padding-bottom:100px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout{
background:#ff4757;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.topButtons{
display:flex;
gap:8px;
}

.petugasBtn{
background:#95a5a6;
color:white;
border:none;
padding:10px 12px;
border-radius:10px;
cursor:pointer;
font-size:16px;
opacity:0.6;
}

.petugasBtn:hover{
opacity:1;
}

.slider{
max-width:520px;
margin:auto;
overflow:hidden;
}

.slides{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
gap:15px;

}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);

min-width:95%;
flex-shrink:0;
scroll-snap-align:start;
}

.menu{
max-width:520px;
margin:20px auto 0 auto;
display:flex;
flex-direction:column;
gap:10px;
}

.big{
font-size:26px;
font-weight:bold;
margin-top:10px;
}

.btn{
margin-top:15px;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.dots{
margin-top:10px;
display:flex;
justify-content:center;
gap:6px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#ccc;
}

.dot.active{
background:#3498db;
}

.blue{background:#3498db;color:white}
.green{background:#2ecc71;color:white}
.red{background:#e74c3c;color:white}

#floatingPetugas{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
border:none;
background:#2ecc71;
color:white;
font-size:28px;
box-shadow:0 6px 15px rgba(0,0,0,0.3);
cursor:pointer;
z-index:999;
}

#floatingPetugas:active{
transform:translateX(-50%) scale(0.9);
}

</style>
</head>

<body>

<script>
(async ()=>{

if(localStorage.getItem("adminLogin") !== "true"){
window.location.replace("index.html")
return
}

const { data } = await window.supabaseClient.auth.getSession()

if(!data.session){
window.location.replace("index.html")
return
}

document.body.style.display="block"

})()
</script>

<div class="top">

<h3>Dashboard Admin</h3>

<div class="topButtons">


</div>

</div>

<div class="slider">

  <button id="periodBtn" class="blue btn">
    Hari ini
  </button>

  <input id="filterTanggal" style="display:none">

  <div class="card">

    <div>Total :</div>
    <div class="big" id="grandTotal">Rp 0</div>

    <hr>

    <div style="display:flex;justify-content:space-between">

      <div>
        Pendapatan :
        <div id="incomeTotal">Rp 0</div>
      </div>

      <div>
        Pengeluaran :
        <div id="expenseTotal">Rp 0</div>
      </div>

    </div>

  </div>

</div>

<div class="menu" id="menuContainer">

<button class="blue btn" onclick="window.location='parkirAktif.html'">
Lihat Parkir Aktif
</button>

<button class="green btn" onclick="window.location='titipan.html'">
Titipan Warung
</button>

<button onclick="exportCSV()">Export Data</button>

</div>

<script>

let dashboardInterval = null
let isFiltering = false // ✅ TAMBAH INIl

function rupiah(n){
n = Number(n) || 0
return "Rp " + n.toLocaleString('id-ID')
}

function isSameDay(a,b){
return a.getFullYear()===b.getFullYear() &&
       a.getMonth()===b.getMonth() &&
       a.getDate()===b.getDate()
}
  
function nowWIB(){
return new Date(
new Date().toLocaleString("en-US",{timeZone:"Asia/Jakarta"})
)
}

async function loadDashboard(){

let today = nowWIB()

let start, end

if(!isCustom || selectedDates.length === 0){
  start = new Date(today)
  start.setHours(0,0,0,0)

  end = new Date(today)
  end.setHours(23,59,59,999)

}else{
  start = new Date(selectedDates[0])
  start.setHours(0,0,0,0)

  end = new Date(selectedDates[1] || selectedDates[0])
  end.setHours(23,59,59,999)
}

let startISO = start.toISOString()
let endISO = end.toISOString()

// =====================
// FETCH DATA
// =====================

let {data:parkir} = await window.supabaseClient
.from("parkir")
.select("checkout_at, checkin_at")
.eq("status","off")
.gte("checkout_at", startISO)
.lte("checkout_at", endISO)

let {data:bulanan} = await window.supabaseClient
.from("bulanan")
.select("last_paid_at, last_paid_amount")
.gte("last_paid_at", startISO)
.lte("last_paid_at", endISO)

let {data:stok} = await window.supabaseClient
.from("stok_log")
.select("*")
.gte("created_at", startISO)
.lte("created_at", endISO)

let {data:titipan} = await window.supabaseClient
.from("titipan_log")
.select("*")
.gte("created_at", startISO)
.lte("created_at", endISO)

// =====================
// HITUNG
// =====================

let income = 0
let expense = 0

// parkir
;(parkir||[]).forEach(p=>{
let tOut = new Date(p.checkout_at)
let tIn = new Date(p.checkin_at)

let durasi = hitungDurasiParkir(tIn, tOut)
let tarif = hitungTarifParkir(durasi)

income += tarif
})

// bulanan
;(bulanan||[]).forEach(b=>{
income += Number(b.last_paid_amount || 30000)
})

// stok
;(stok||[]).forEach(s=>{
if(s.jenis==="jual") income += Number(s.total||0)
if(s.jenis==="pesan") expense += Number(s.total||0)
})

// titipan (sesuaikan kalau beda)
;(titipan||[]).forEach(t=>{
let total = Number(t.total || 0)

if(t.jenis==="masuk") income += total
if(t.jenis==="keluar") expense += total
})

// =====================
// RENDER
// =====================

document.getElementById("incomeTotal").innerText = rupiah(income)
document.getElementById("expenseTotal").innerText = rupiah(expense)
document.getElementById("grandTotal").innerText = rupiah(income - expense)

document.getElementById("periodBtn").innerText = formatLabel()

}

async function logout(){

await window.supabaseClient.auth.signOut()

localStorage.removeItem("adminLogin")

window.location.replace("admin.html")

}

async function resetData(){

let konfirmasi = prompt("Ketik RESET")

if(konfirmasi !== "RESET") return

try{

/* parkir */
await window.supabaseClient
.from("parkir")
.delete()
.neq("kode","")

/* bulanan */
await window.supabaseClient
.from("bulanan")
.delete()
.neq("nama","")

/* stok barang */
await window.supabaseClient
.from("stok_barang")
.delete()
.neq("nama_item","")

/* log stok */
await window.supabaseClient
.from("stok_log")
.delete()
.gt("qty",-1)

/* barang titipan */
await window.supabaseClient
.from("barang_titipan")
.delete()
.neq("nama_item","")

/* log titipan */
await window.supabaseClient
.from("titipan_log")
.delete()
.gt("qty",-1)

alert("SEMUA DATA TEST BERHASIL DIRESET")

location.reload()

}catch(err){

alert("Gagal reset: " + err.message)
console.log(err)

}

}

function goPetugas(){
window.location.href="index.html"
}

let selectedDates = []
let isCustom = false

function formatLabel(){
  if(!isCustom || selectedDates.length === 0){
    return "Hari ini"
  }

  let a = selectedDates[0]
  let b = selectedDates[1] || a

  const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"]

  let d1 = a.getDate()
  let m1 = bulan[a.getMonth()]
  let y1 = String(a.getFullYear()).slice(-2)

  let d2 = b.getDate()
  let m2 = bulan[b.getMonth()]
  let y2 = String(b.getFullYear()).slice(-2)

  if(a.getTime() === b.getTime()){
    return `${d1} ${m1} ${y1}`
  }

  if(a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()){
    return `${d1} - ${d2} ${m2} ${y2}`
  }

  if(a.getFullYear() === b.getFullYear()){
    return `${d1} ${m1} - ${d2} ${m2} ${y2}`
  }

  return `${d1} ${m1} ${y1} - ${d2} ${m2} ${y2}`
}

window.onload = () => {

if(dashboardInterval !== null){
  clearInterval(dashboardInterval)
}

setTimeout(()=>{
  if(typeof loadDashboard === "function"){
    loadDashboard()
    dashboardInterval = setInterval(loadDashboard,10000)
  }else{
    console.log("loadDashboard belum siap")
  }
}, 500)

if(IS_DEV){
  const btn = document.createElement("button")
  btn.className = "red btn"
  btn.innerText = "Reset Data Test"
  btn.onclick = resetData

  document.getElementById("menuContainer").appendChild(btn)
}

};


window.addEventListener("beforeunload",()=>{
if(dashboardInterval !== null){
clearInterval(dashboardInterval)
}
})
/* =========================
   SLIDER DOT INDICATOR
========================= */

document.addEventListener("DOMContentLoaded",()=>{

const slides = document.querySelector(".slides")
const dots = document.querySelectorAll(".dot")

if(!slides || !dots.length) return

let scrollTimer

slides.addEventListener("scroll",()=>{

clearTimeout(scrollTimer)

scrollTimer = setTimeout(()=>{

let cardWidth = slides.querySelector(".card").offsetWidth + 15
let index = Math.round(slides.scrollLeft / cardWidth)

dots.forEach(d=>d.classList.remove("active"))
if(dots[index]) dots[index].classList.add("active")

},50)

})

})

</script>

<button id="floatingPetugas" onclick="goPetugas()">👨‍🔧</button>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const fp = flatpickr("#filterTanggal", {
  mode: "range",
  dateFormat: "Y-m-d",
  onChange: function(dates){
    if(dates.length >= 1){
      selectedDates = dates
      isCustom = true
      loadDashboard()
    }
  }
})

document.getElementById("periodBtn").onclick = ()=>{
  fp.open()
}

})

async function exportCSV(){

let month = new Date()
month.setMonth(month.getMonth()-1)

let {data} = await window.supabaseClient
.from("stok_log")
.select("*")
.gte("created_at", month.toISOString())

if(!data || data.length === 0){
alert("Tidak ada data")
return
}

let csv = "id,jenis,qty,total,created_at\n"

data.forEach(row=>{
csv += `${row.id},${row.jenis},${row.qty},${row.total},${row.created_at}\n`
})

let blob = new Blob([csv], { type: 'text/csv' })
let url = URL.createObjectURL(blob)

let a = document.createElement("a")
a.href = url
a.download = "backup.csv"
a.click()

}

</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
