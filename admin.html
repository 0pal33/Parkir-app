<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Login Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#eee;
text-align:center;
padding:20px;
}
input{
width:80%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
}
button{
padding:15px;
margin:10px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}
.blue{background:#3498db;color:white}
.red{background:#e74c3c;color:white}
</style>
</head>

<body>

<h2>Login Admin</h2>

<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>

<button class="blue" onclick="window.login()">Login</button>
<button class="red" onclick="window.back()">Batal</button>

<script>

window.addEventListener("DOMContentLoaded", ()=>{

  if(localStorage.getItem("adminLogin")==="true"){
    window.location.href="index.html"
  }

  window.back = function(){
    location.href="index.html"
  }

  window.login = async function(){

    let email=document.getElementById("email").value.trim()
    let password=document.getElementById("password").value
    let btn=document.querySelector(".blue")

    if(!email || !password){
      alert("Isi email dan password")
      return
    }

    btn.disabled = true
    btn.innerText = "Loading..."

    const { error } = await window.supabaseClient.auth.signInWithPassword({
      email,password
    })

    if(error){
      alert("Login gagal")
      btn.disabled = false
      btn.innerText = "Login"
      return
    }

    alert("Login berhasil")

    localStorage.setItem("adminLogin","true")

    window.location.href="index.html"
  }

  document.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      window.login()
    }
  })

})

</script>

<!-- SUGER DEVTOOL -->
<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<!-- SERVICE WORKER -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
