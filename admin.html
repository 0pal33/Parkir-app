<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#eee;
margin:0;
padding:20px;
}

input{
width:250px;
height:45px;
font-size:16px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
padding:5px;
}

button{
padding:15px 25px;
margin:8px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.blue{background:#3498db;color:white}
.red{background:#e74c3c;color:white}
</style>
</head>

<body>

<h2>Login Admin</h2>

<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>

<button class="blue" onclick="login()">Login</button>
<button class="red" onclick="kembali()">Batal</button>

<script>

const supabase = window.supabase.createClient(
"https://ktpvkmmuugjcoscxbfja.supabase.co",
"sb_publishable_1SJL-5yxWSAC3osTXiEdMw_3Q-060K2"
);

async function login(){

let email = document.getElementById("email").value
let password = document.getElementById("password").value

const { data, error } = await supabase.auth.signInWithPassword({
email: email,
password: password
})

if(error){
alert("Login gagal: " + error.message)
}else{
window.location.href = "dashboard.html"
}

}

function kembali(){
window.location.href = "index.html"
}

</script>

</body>
</html>
