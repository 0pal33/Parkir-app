<!DOCTYPE html>
<html>
<head>
  <title>Parkir Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>SCAN QR</h2>
<input type="text" id="qr" placeholder="Scan QR disini"/>
<button onclick="checkin()">Check-in</button>
<button onclick="checkout()">Check-out</button>

<h2>DATA PARKIR</h2>
<button onclick="loadData()">Refresh</button>

<table border="1" id="tabel">
<tr>
<th>QR</th>
<th>Status</th>
<th>Checkin</th>
<th>Checkout</th>
<th>Total</th>
</tr>
</table>

<script>

const supabase = window.supabase.createClient(
  "https://ktpvkmmuugjcoscxbfja.supabase.co",
  "sb_publishable_1SJL-5yxWSAC3osTXiEdMw_3Q-060K2"
)

async function checkin(){
let qr = document.getElementById("qr").value

await supabase.from("parkir").insert([
{
qr_code: qr,
status: "on"
}
])

alert("Checkin sukses")
}

async function checkout(){
let qr = document.getElementById("qr").value

await supabase.from("parkir")
.update({
status: "off",
checkout_at: new Date()
})
.eq("qr_code", qr)
.eq("status", "on")

alert("Checkout sukses")
}

async function loadData(){

let { data } = await supabase
.from("parkir")
.select("*")
.order("checkin_at", { ascending: false })

let tabel = document.getElementById("tabel")

tabel.innerHTML = `
<tr>
<th>QR</th>
<th>Status</th>
<th>Checkin</th>
<th>Checkout</th>
<th>Total</th>
</tr>
`

data.forEach(d => {
tabel.innerHTML += `
<tr>
<td>${d.qr_code}</td>
<td>${d.status}</td>
<td>${d.checkin_at || ""}</td>
<td>${d.checkout_at || ""}</td>
<td>${d.total_bayar || 0}</td>
</tr>
`
})
}

</script>

</body>
</html>
