<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Login Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/auth.js"></script>
  
<style>
body{
font-family:Arial;
background:#eee;
text-align:center;
padding:20px;
}
input{
width:80%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
}
button{
padding:15px;
margin:10px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}
.blue{background:#3498db;color:white}
.red{background:#e74c3c;color:white}
.forgot{background:transparent;color:#3498db;padding:8px 10px;display:block;margin:0 auto;border:none}
.gray{background:#95a5a6;color:white}
.forgot-box{max-width:420px;margin:20px auto 0;padding:18px;border-radius:14px;background:white;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.forgot-box p{font-size:14px;line-height:1.5;color:#555}
.forgot-box button{margin:6px}
</style>
</head>

<body>

<h2>Login Admin</h2>

<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>

<button class="blue" onclick="window.login()">Login</button>
<button id="forgotPasswordBtn" class="forgot" type="button">Lupa Password?</button>
<button class="red" onclick="window.back()">Batal</button>

<div id="forgotBox" class="forgot-box" hidden>
  <h3>Lupa Password</h3>
  <p>Masukkan email akunmu. Link untuk membuat password baru akan dikirim ke email tersebut.</p>
  <input id="forgotEmail" type="email" placeholder="Email akun">
  <button id="sendResetBtn" class="blue" type="button">Kirim Link Reset</button>
  <button id="cancelForgotBtn" class="gray" type="button">Batal</button>
</div>

<script>

window.addEventListener("DOMContentLoaded", ()=>{


  window.back = function(){
    location.href="index.html"
  }

  const forgotBtn = document.getElementById("forgotPasswordBtn")
const forgotBox = document.getElementById("forgotBox")
const forgotEmail = document.getElementById("forgotEmail")
const sendResetBtn = document.getElementById("sendResetBtn")
const cancelForgotBtn = document.getElementById("cancelForgotBtn")

forgotBtn.addEventListener("click", ()=>{
  forgotBox.hidden = false
  forgotEmail.value = document.getElementById("email").value.trim()
  forgotEmail.focus()
})

cancelForgotBtn.addEventListener("click", ()=>{
  forgotBox.hidden = true
})

sendResetBtn.addEventListener("click", async ()=>{
  const email = forgotEmail.value.trim()

  if(!email){
    alert("Masukkan email akun")
    forgotEmail.focus()
    return
  }

  sendResetBtn.disabled = true
  sendResetBtn.innerText = "Mengirim..."

  const redirectTo = `${location.origin}/reset-password.html`

  const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo
  })

  if(error){
    alert("Gagal mengirim link reset: " + error.message)
    sendResetBtn.disabled = false
    sendResetBtn.innerText = "Kirim Link Reset"
    return
  }

  alert("Jika email terdaftar, link reset password sudah dikirim. Periksa Inbox atau Spam.")
  forgotBox.hidden = true
  sendResetBtn.disabled = false
  sendResetBtn.innerText = "Kirim Link Reset"
})

  window.login = async function(){

    let email=document.getElementById("email").value.trim()
    let password=document.getElementById("password").value
    let btn=document.querySelector('button[onclick="window.login()"]')

    if(!email || !password){
      alert("Isi email dan password")
      return
    }

    btn.disabled = true
    btn.innerText = "Loading..."

    const { error } = await window.supabaseClient.auth.signInWithPassword({
      email,password
    })

    if(error){
      alert("Login gagal")
      btn.disabled = false
      btn.innerText = "Login"
      return
    }

    alert("Login berhasil")

    window.location.href="index.html"
  }

  document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !forgotBox.hidden){
    e.preventDefault()
    sendResetBtn.click()
    return
  }

  if(e.key==="Enter"){
    window.login()
  }
})

})

</script>

<!-- SUGER DEVTOOL -->
<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<!-- SERVICE WORKER -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
