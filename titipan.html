<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Titip Jajan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:140px;
}

h3{
text-align:center;
margin-top:0;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
box-sizing:border-box;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
border:none;
border-radius:10px;
padding:10px 14px;
font-size:15px;
cursor:pointer;
}

.green{background:#2ecc71;color:#fff;}
.blue{background:#3498db;color:#fff;}
.red{background:#e74c3c;color:#fff;}
.orange{background:#f39c12;color:#fff;}

.item{
background:#fff;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.nama{font-weight:bold;font-size:16px;}
.kecil{font-size:13px;color:#666;}
.qty{font-size:22px;font-weight:bold;}

.box{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:12px;
}

.check{
display:flex;
gap:8px;
align-items:center;
margin-bottom:10px;
font-weight:bold;
}

#formArea,#aksiArea{
display:none;
}

.floatingTambah{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
font-size:30px;
padding:0;
}

.floatingLog{
position:fixed;
right:20px;
bottom:90px;
width:60px;
height:60px;
border-radius:50%;
font-size:24px;
padding:0;
}

.logMasuk{border-left:5px solid #2ecc71;}
.logAmbil{border-left:5px solid #e74c3c;}
.logHarga{border-left:5px solid #f1c40f;}

.rowBtn{
display:flex;
gap:8px;
margin-bottom:10px;
}

.rowBtn button{
flex:1;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:12px;
}

.card{
background:#fff;
padding:14px;
border-radius:12px;
text-align:center;
}

.cardTitle{
font-size:13px;
color:#666;
margin-bottom:6px;
}

.cardValue{
font-size:22px;
font-weight:bold;
color:#27ae60;
}
</style>

</head>
<body>

<h3 id="judul">Titip Jajan</h3>

<div class="dashboard">

<div class="card">
<div class="cardTitle">Terjual Hari Ini</div>
<div class="cardValue" id="dashQty">0 pcs</div>
</div>

<div class="card">
<div class="cardTitle">Bayar Penitip</div>
<div class="cardValue" id="dashTotal">Rp 0</div>
</div>

</div>

<input id="searchBox" placeholder="Cari barang / penitip..." oninput="renderList()">

<div id="listArea"></div>
<div id="formArea"></div>
<div id="aksiArea"></div>

<button class="floatingLog blue" onclick="showLog()">📜</button>
<button class="floatingTambah green" onclick="formTambah()">+</button>

<script>

if(!window.DATA) window.DATA=[]
if(window.CURRENT===undefined) window.CURRENT=null

let saveLock=false

async function loadDashboard(){

let today=new Date()
today.setHours(0,0,0,0)

const {data,error}=await window.supabaseClient
.from("titipan_log")
.select("*")
.eq("jenis","ambil")
.gte("created_at",today.toISOString())

if(error) return

let qty=0
let total=0

data.forEach(i=>{
qty += Number(i.qty||0)
total += Number(i.total||0)
})

dashQty.innerText=qty+" pcs"
dashTotal.innerText="Rp "+total.toLocaleString("id-ID")

}

/* =======================
LOAD DATA
======================= */

async function loadData(){

await loadDashboard()

const {data,error}=await window.supabaseClient
.from("barang_titipan")
.select("*")
.order("nama_item")

if(error){
alert(error.message)
return
}

window.DATA=data||[]
renderList()

}

/* =======================
LIST
======================= */

function renderList(){

judul.style.display="block"
searchBox.style.display="block"
listArea.style.display="block"
formArea.style.display="none"
aksiArea.style.display="none"

let cari=searchBox.value.toLowerCase()
let html=""

let hasil=window.DATA.filter(i=>
(i.nama_item||"").toLowerCase().includes(cari) ||
(i.nama_penitip||"").toLowerCase().includes(cari)
)

if(hasil.length===0){
html="<div class='box'>Tidak ada data</div>"
}

hasil.forEach(i=>{

let warna=i.qty<=0 ? "#ffd6d6" : "#fff"

html+=`
<div class="item" style="background:${warna}">

<div style="flex:1">
<div class="nama">${i.nama_item}</div>
<div class="kecil">${i.nama_penitip}</div>
<div class="kecil">
Jual Rp ${Number(i.harga_jual||0).toLocaleString('id-ID')}
</div>
</div>

<div class="qty">${i.qty}</div>

<button class="blue" onclick="formAksi('${i.id}')">📥</button>

</div>
`

})

listArea.innerHTML=html

}

/* =======================
FORM TAMBAH
======================= */

function formTambah(){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
formArea.style.display="block"

formArea.innerHTML=`

<div class="box">

<h3>Tambah Barang</h3>

<input id="t_nama" placeholder="Nama barang">
<input id="t_penitip" placeholder="Nama penitip">
<input id="t_qty" type="number" placeholder="Jumlah titip">
<input id="t_jual" type="number" placeholder="Harga jual">
<input id="t_pen" type="number" placeholder="Harga penitip">

<button class="green" onclick="simpanTambah()">Simpan</button>
<button class="red" onclick="renderList()">Batal</button>

</div>
`

}

async function simpanTambah(){

if(saveLock) return
saveLock=true

let nama=t_nama.value.trim()
let penitip=t_penitip.value.trim()
let qty=parseInt(t_qty.value||0)
let jual=parseInt(t_jual.value||0)
let pen=parseInt(t_pen.value||0)

if(!nama || !penitip || qty<=0){
alert("Lengkapi data")
saveLock=false
return
}

const {data,error}=await window.supabaseClient
.from("barang_titipan")
.insert({
nama_item:nama,
nama_penitip:penitip,
qty:qty,
harga_jual:jual,
harga_penitip:pen
})
.select()
.single()

if(error){
alert(error.message)
saveLock=false
return
}

await window.supabaseClient
.from("titipan_log")
.insert({
item_id:data.id,
jenis:"masuk",
qty:qty,
total:0
})

saveLock=false
loadData()

}

/* =======================
FORM AKSI
======================= */

function formAksi(id){

window.CURRENT=window.DATA.find(x=>x.id==id)
if(!window.CURRENT) return

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
aksiArea.style.display="block"

aksiArea.innerHTML=`

<div class="box">

<h3>${window.CURRENT.nama_item}</h3>

<div class="check">
<input type="checkbox" id="c_ambil" onchange="toggleAksi()"> Ambil
</div>

<div id="boxAmbil" style="display:none">
<input id="laku" type="number" placeholder="Barang terjual">
<input id="bayar" readonly placeholder="Bayar penitip">
</div>

<div class="check">
<input type="checkbox" id="c_harga" onchange="toggleAksi()"> Update Harga
</div>

<div id="boxHarga" style="display:none">
<input id="u_jual" type="number" value="${window.CURRENT.harga_jual}">
<input id="u_pen" type="number" value="${window.CURRENT.harga_penitip}">
</div>

<div class="check">
<input type="checkbox" id="c_nitip" onchange="toggleAksi()"> Nitip Lagi
</div>

<div id="boxNitip" style="display:none">
<input id="n_qty" type="number" placeholder="Qty baru">
</div>

<button class="green" onclick="prosesAksi()">✓</button>
<button class="red" onclick="renderList()">Batal</button>

</div>
`

laku.oninput=function(){
let val=parseInt(laku.value||0)
bayar.value="Rp "+(val*window.CURRENT.harga_penitip).toLocaleString('id-ID')
}

}

function toggleAksi(){

boxAmbil.style.display=c_ambil.checked?"block":"none"
boxHarga.style.display=c_harga.checked?"block":"none"
boxNitip.style.display=c_nitip.checked?"block":"none"

}

/* =======================
PROSES
======================= */

async function prosesAksi(){

if(saveLock) return
saveLock=true

let ambil=c_ambil.checked
let harga=c_harga.checked
let nitip=c_nitip.checked

if(!ambil && !harga && !nitip){
alert("Pilih aksi dulu")
saveLock=false
return
}

let updateData={}
let logs=[]

if(ambil){

let terjual=parseInt(laku.value||0)

if(terjual<=0){
alert("Isi jumlah terjual")
saveLock=false
return
}

if(terjual>window.CURRENT.qty){
alert("Melebihi stok")
saveLock=false
return
}

let total=terjual * window.CURRENT.harga_penitip

logs.push({
item_id:window.CURRENT.id,
jenis:"ambil",
qty:terjual,
total:total
})

if(!nitip){
updateData.qty=window.CURRENT.qty-terjual
}

}

if(nitip){

let q=parseInt(n_qty.value||0)

if(q<=0){
alert("Isi qty baru")
saveLock=false
return
}

updateData.qty=q

logs.push({
item_id:window.CURRENT.id,
jenis:"masuk",
qty:q,
total:0
})

}

if(harga){

updateData.harga_jual=parseInt(u_jual.value||0)
updateData.harga_penitip=parseInt(u_pen.value||0)

logs.push({
item_id:window.CURRENT.id,
jenis:"harga",
qty:0,
total:0
})

}

updateData.updated_at=new Date()

const {error}=await window.supabaseClient
.from("barang_titipan")
.update(updateData)
.eq("id",window.CURRENT.id)

if(error){
alert(error.message)
saveLock=false
return
}

for(let log of logs){

await window.supabaseClient
.from("titipan_log")
.insert(log)

}

saveLock=false
loadData()

}

/* =======================
LOG PREMIUM
======================= */

async function showLog(mode="today"){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
formArea.style.display="none"
aksiArea.style.display="block"

aksiArea.innerHTML="<div class='box'>Loading...</div>"

let q=window.supabaseClient
.from("titipan_log")
.select("*")
.order("created_at",{ascending:false})
.limit(100)

const {data,error}=await q

if(error){
aksiArea.innerHTML="<div class='box'>Gagal load log</div>"
return
}

let now=new Date()
let totalHari=0
let trxHari=0

let html=`
<div class="box">

<h3>Riwayat</h3>

<div class="rowBtn">
<button class="blue" onclick="showLog('today')">Hari Ini</button>
<button class="orange" onclick="showLog('week')">7 Hari</button>
<button class="green" onclick="showLog('all')">Semua</button>
</div>
`

data.forEach(i=>{

let t=new Date(i.created_at)
let diff=(now-t)/86400000

if(mode==="today" && t.toDateString()!==now.toDateString()) return
if(mode==="week" && diff>7) return

if(t.toDateString()===now.toDateString()){
trxHari++
if(i.jenis==="ambil"){
totalHari+=Number(i.total||0)
}
}

let item=window.DATA.find(x=>x.id==i.item_id)

let nama=item ? item.nama_item : "-"
let penitip=item ? item.nama_penitip : "-"

let cls="logMasuk"
let icon="🟢"

if(i.jenis==="ambil"){
cls="logAmbil"
icon="🔴"
}

if(i.jenis==="harga"){
cls="logHarga"
icon="🟡"
}

html+=`
<div class="box ${cls}">
<b>${icon} ${i.jenis}</b><br>
${nama} - ${penitip}<br>
Qty: ${i.qty} |
Rp ${Number(i.total||0).toLocaleString('id-ID')}<br>
<span class="kecil">
${t.toLocaleString('id-ID')}
</span>
</div>
`

})

html+=`
<div class="box">
<b>Total bayar penitip hari ini</b><br>
Rp ${totalHari.toLocaleString('id-ID')}<br><br>

<b>Total transaksi hari ini</b><br>
${trxHari}
</div>

<button class="red" onclick="renderList()">Kembali</button>

</div>
`

aksiArea.innerHTML=html

}

loadData()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
window.__SUGER_LOADED__=true
const s=document.createElement("script")
s.src="https://suger-cdn.vercel.app/suger-dev.js"
document.body.appendChild(s)
}
</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
