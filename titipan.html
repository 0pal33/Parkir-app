<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Titip Jajan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/titipanCore.js"></script>
<script src="js/titipanUI.js"></script>

<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  margin:0;
  padding:20px;
  padding-bottom:140px;
}

h3{
  text-align:center;
  margin-top:0;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  box-sizing:border-box;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  border:none;
  border-radius:10px;
  padding:10px 14px;
  font-size:15px;
  cursor:pointer;
}

.green{background:#2ecc71;color:#fff;}
.blue{background:#3498db;color:#fff;}
.red{background:#e74c3c;color:#fff;}
.orange{background:#f39c12;color:#fff;}
.gray{background:#95a5a6;color:#fff;}

.item{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.nama{
  font-weight:bold;
  font-size:16px;
}

.kecil{
  font-size:13px;
  color:#666;
}

.qty{
  font-size:22px;
  font-weight:bold;
  min-width:42px;
  text-align:center;
}

.box{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.cardTitle{
  font-size:13px;
  color:#666;
  margin-bottom:6px;
}

.cardValue{
  font-size:22px;
  font-weight:bold;
  color:#27ae60;
}

#formArea,#aksiArea{
  display:none;
}

.floatingTambah{
  position:fixed;
  right:20px;
  bottom:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  font-size:30px;
  padding:0;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}

.floatingLog{
  position:fixed;
  right:20px;
  bottom:90px;
  width:60px;
  height:60px;
  border-radius:50%;
  font-size:24px;
  padding:0;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}

.floatingBack{
  position:fixed;
  left:20px;
  bottom:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  font-size:24px;
  padding:0;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}

.rowBtn{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.rowBtn button{
  flex:1;
}

.aksiItem{
  background:#fff;
  border:1px solid #eee;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.aksiHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}

.aksiCheck{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:16px;
  margin:0;
}

.aksiCheck input[type="checkbox"]{
  width:22px;
  height:22px;
  margin:0;
}

.aksiPanel{
  display:none;
  background:#f8f8f8;
  border-radius:12px;
  padding:12px;
}

.aksiPanel input{
  margin-bottom:10px;
}

.listActionBtns{
  display:flex;
  gap:8px;
  align-items:center;
}

.listActionBtns .blue,
.listActionBtns .red{
  min-width:52px;
  height:40px;
  padding:0 10px;
}

.logMasuk{border-left:5px solid #2ecc71;}
.logAmbil{border-left:5px solid #e74c3c;}
.logHarga{border-left:5px solid #f1c40f;}

.kecilBox{
  color:#777;
  font-size:13px;
}

@media (max-width:420px){
  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .cardValue{
    font-size:20px;
  }

  .item{
    align-items:center;
  }

  .listActionBtns{
    flex-direction:column;
  }
}
</style>

</head>
<body>

<h3 id="judul">Titip Jajan</h3>

<div class="dashboard">
  <div class="card">
    <div class="cardTitle">Terjual Hari Ini</div>
    <div class="cardValue" id="dashQty">0 pcs</div>
  </div>

  <div class="card">
    <div class="cardTitle">Bayar Penitip</div>
    <div class="cardValue" id="dashTotal">Rp 0</div>
  </div>
</div>

<input id="searchBox" placeholder="Cari barang / penitip..." oninput="TitipanUI.renderList()">

<div id="listArea"></div>
<div id="formArea"></div>
<div id="aksiArea"></div>

<button class="floatingBack red" onclick="location.href='index.html'">🏠</button>
<button class="floatingLog orange" onclick="TitipanCore.showLog('today')">📋</button>
<button class="floatingTambah green" onclick="TitipanUI.formTambah()">+</button>

<script>
document.addEventListener("DOMContentLoaded", async ()=>{

  const { data } = await window.supabaseClient.auth.getSession()

  if(!data.session){
    alert("Akses ditolak")
    location.href="index.html"
    return
  }

  // Dashboard summary hanya untuk admin.
  if(localStorage.getItem("adminLogin") !== "true"){
    const dash = document.querySelector(".dashboard")
    if(dash) dash.style.display = "none"
  }

  await TitipanCore.loadData()

})
</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true
  const s = document.createElement("script")
  s.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(s)
}
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
