<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Barang Titipan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:120px;
}

h3{
text-align:center;
margin-top:0;
}

.card{
background:white;
padding:14px;
border-radius:14px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.nama{
font-weight:bold;
font-size:17px;
}

.small{
font-size:13px;
color:#666;
margin-top:2px;
}

.qty{
font-size:20px;
font-weight:bold;
}

.btnDatang{
background:#3498db;
color:white;
border:none;
width:56px;
height:56px;
border-radius:50%;
font-size:24px;
cursor:pointer;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:68px;
height:68px;
border:none;
border-radius:50%;
background:#2ecc71;
color:white;
font-size:32px;
box-shadow:0 6px 15px rgba(0,0,0,.25);
cursor:pointer;
}

.layer{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:white;
padding:20px;
overflow:auto;
display:none;
z-index:999;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
font-size:16px;
}

.row{
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.check{
width:22px;
height:22px;
}

.section{
background:#f7f7f7;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}

.oke{
position:fixed;
right:20px;
bottom:20px;
width:68px;
height:68px;
border:none;
border-radius:50%;
background:#2ecc71;
color:white;
font-size:30px;
box-shadow:0 6px 15px rgba(0,0,0,.25);
}

.back{
position:fixed;
left:20px;
bottom:20px;
width:68px;
height:68px;
border:none;
border-radius:50%;
background:#e74c3c;
color:white;
font-size:28px;
box-shadow:0 6px 15px rgba(0,0,0,.25);
}

.total{
font-weight:bold;
font-size:18px;
text-align:center;
padding:8px;
}

</style>
</head>

<body>

<h3>Barang Titipan</h3>

<div id="list"></div>

<button class="fab" onclick="openTambah()">+</button>

<!-- =======================
TAMBAH
======================= -->
<div class="layer" id="boxTambah">

<h3>Tambah Barang Titipan</h3>

<input id="t_nama" placeholder="Nama barang">
<input id="t_penitip" placeholder="Nama penitip">
<input id="t_qty" type="number" placeholder="Jumlah titip">
<input id="t_jual" type="number" placeholder="Harga jual">
<input id="t_modal" type="number" placeholder="Harga dari penitip">

<button class="back" onclick="closeTambah()">✕</button>
<button class="oke" onclick="saveTambah()">✓</button>

</div>

<!-- =======================
DATANG
======================= -->
<div class="layer" id="boxDatang">

<h3 id="judulDatang">Kedatangan Penitip</h3>

<!-- AMBIL -->
<div class="section">

<div class="row">
<input class="check" type="checkbox" id="cbAmbil">
<b>Ambil</b>
</div>

<input id="sisa" type="number" placeholder="Sisa barang" oninput="hitungDariSisa()">
<input id="terjual" type="number" placeholder="Barang terjual" oninput="hitungDariLaku()">

<div class="total" id="bayar">Total dibayar : Rp 0</div>

</div>

<!-- HARGA -->
<div class="section">

<div class="row">
<input class="check" type="checkbox" id="cbHarga">
<b>Update Harga</b>
</div>

<input id="u_jual" type="number" placeholder="Harga jual">
<input id="u_modal" type="number" placeholder="Harga penitip">

</div>

<!-- NITIP -->
<div class="section">

<div class="row">
<input class="check" type="checkbox" id="cbNitip">
<b>Nitip</b>
</div>

<input id="qtyBaru" type="number" placeholder="Qty baru">

</div>

<button class="back" onclick="closeDatang()">✕</button>
<button class="oke" onclick="saveDatang()">✓</button>

</div>

<script>

let DATA=[]
let CURRENT=null

function rupiah(n){
return Number(n||0).toLocaleString("id-ID")
}

/* ======================
LOAD
====================== */

async function loadData(){

const {data,error}=await window.supabaseClient
.from("barang_titipan")
.select("*")
.order("nama_item")

if(error){
alert("Gagal load")
return
}

DATA=data||[]
render()

}

function render(){

let html=""

DATA.forEach(i=>{

html+=`
<div class="card">

<div>
<div class="nama">${i.nama_item}</div>
<div class="small">${i.nama_penitip}</div>
<div class="small">Harga jual Rp ${rupiah(i.harga_jual)}</div>
</div>

<div style="text-align:center">
<div class="qty">${i.qty}</div>
<button class="btnDatang"
onclick="openDatang('${i.id}')">🧺</button>
</div>

</div>
`

})

document.getElementById("list").innerHTML=html

}

/* ======================
TAMBAH
====================== */

function openTambah(){
document.getElementById("boxTambah").style.display="block"
}

function closeTambah(){
document.getElementById("boxTambah").style.display="none"
}

async function saveTambah(){

let nama_item=document.getElementById("t_nama").value.trim()
let nama_penitip=document.getElementById("t_penitip").value.trim()
let qty=parseInt(document.getElementById("t_qty").value||0)
let harga_jual=parseInt(document.getElementById("t_jual").value||0)
let harga_penitip=parseInt(document.getElementById("t_modal").value||0)

if(!nama_item || !nama_penitip){
alert("Lengkapi data")
return
}

await window.supabaseClient
.from("barang_titipan")
.insert({
nama_item,
nama_penitip,
qty,
harga_jual,
harga_penitip
})

closeTambah()
loadData()

}

/* ======================
DATANG
====================== */

function openDatang(id){

CURRENT=DATA.find(x=>x.id===id)

document.getElementById("judulDatang").innerText=
CURRENT.nama_item+" - "+CURRENT.nama_penitip

document.getElementById("u_jual").value=CURRENT.harga_jual
document.getElementById("u_modal").value=CURRENT.harga_penitip

document.getElementById("sisa").value=""
document.getElementById("terjual").value=""
document.getElementById("qtyBaru").value=""

document.getElementById("bayar").innerText="Total dibayar : Rp 0"

document.getElementById("cbAmbil").checked=false
document.getElementById("cbHarga").checked=false
document.getElementById("cbNitip").checked=false

document.getElementById("boxDatang").style.display="block"

}

function closeDatang(){
document.getElementById("boxDatang").style.display="none"
}

function hitungDariSisa(){

let sisa=parseInt(document.getElementById("sisa").value||0)

let laku=CURRENT.qty-sisa
if(laku<0) laku=0

document.getElementById("terjual").value=laku
document.getElementById("bayar").innerText=
"Total dibayar : Rp "+rupiah(laku*CURRENT.harga_penitip)

}

function hitungDariLaku(){

let laku=parseInt(document.getElementById("terjual").value||0)

let sisa=CURRENT.qty-laku
if(sisa<0) sisa=0

document.getElementById("sisa").value=sisa
document.getElementById("bayar").innerText=
"Total dibayar : Rp "+rupiah(laku*CURRENT.harga_penitip)

}

async function saveDatang(){

let ambil=document.getElementById("cbAmbil").checked
let harga=document.getElementById("cbHarga").checked
let nitip=document.getElementById("cbNitip").checked

let qtyBaru=CURRENT.qty

if(ambil) qtyBaru=0
if(nitip) qtyBaru=parseInt(document.getElementById("qtyBaru").value||0)

let harga_jual=CURRENT.harga_jual
let harga_penitip=CURRENT.harga_penitip

if(harga){
harga_jual=parseInt(document.getElementById("u_jual").value||0)
harga_penitip=parseInt(document.getElementById("u_modal").value||0)
}

await window.supabaseClient
.from("barang_titipan")
.update({
qty:qtyBaru,
harga_jual,
harga_penitip,
updated_at:new Date().toISOString()
})
.eq("id",CURRENT.id)

await window.supabaseClient
.from("titipan_log")
.insert({

item_id:CURRENT.id,
nama_item:CURRENT.nama_item,
nama_penitip:CURRENT.nama_penitip,

aksi:
(ambil?"ambil ":"")+
(harga?"harga ":"")+
(nitip?"nitip":""),

qty_lama:CURRENT.qty,
qty_baru:qtyBaru,

terjual:parseInt(document.getElementById("terjual").value||0),
sisa:parseInt(document.getElementById("sisa").value||0),

total_bayar:
parseInt(document.getElementById("terjual").value||0)
*
CURRENT.harga_penitip,

harga_jual,
harga_penitip

})

closeDatang()
loadData()

}

loadData()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
window.__SUGER_LOADED__=true
const s=document.createElement("script")
s.src="https://suger-cdn.vercel.app/suger-dev.js"
document.body.appendChild(s)
}
</script>

<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js")
}
</script>

</body>
</html>
