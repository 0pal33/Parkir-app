<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Titip Jajan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:120px;
}

h3{
text-align:center;
margin-top:0;
}

.item{
background:#fff;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.nama{font-weight:bold;font-size:16px}
.kecil{font-size:13px;color:#666}
.qty{font-size:20px;font-weight:bold}

button{
border:none;
border-radius:10px;
padding:10px 14px;
font-size:15px;
cursor:pointer;
}

.blue{background:#3498db;color:#fff}
.green{background:#2ecc71;color:#fff}
.red{background:#e74c3c;color:#fff}

.floatingTambah{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
font-size:30px;
padding:0;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
box-sizing:border-box;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.box{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:12px;
}

.row{
display:flex;
gap:10px;
}

.row > div{
flex:1;
}

.check{
display:flex;
align-items:center;
gap:8px;
margin-bottom:10px;
font-weight:bold;
}

#formArea{
display:none;
}

#aksiArea{
display:none;
}
</style>

</head>
<body>

<h3 id="judul">Titip Jajan</h3>

<div id="listArea"></div>

<div id="formArea"></div>

<div id="aksiArea"></div>

<button
class="floatingTambah green"
onclick="formTambah()"
>
+
</button>

<script>

if(!window.DATA) window.DATA=[]
if(window.CURRENT===undefined) window.CURRENT=null

/* ===========================
LOAD DATA
=========================== */

async function loadData(){

const {data,error}=await window.supabaseClient
.from("barang_titipan")
.select("*")
.order("nama_item")

if(error){
alert(error.message)
console.log(error)
return
}

window.DATA=data||[]
renderList()

}

function renderList(){

document.getElementById("judul").style.display="block"
document.getElementById("listArea").style.display="block"
document.getElementById("formArea").style.display="none"
document.getElementById("aksiArea").style.display="none"

let html=""

if(window.DATA.length===0){
html="<div class='box'>Belum ada barang titipan</div>"
}

window.DATA.forEach(i=>{

html+=`
<div class="item">

<div style="flex:1">
<div class="nama">${i.nama_item}</div>
<div class="kecil">${i.nama_penitip}</div>
<div class="kecil">Harga jual Rp ${Number(i.harga_jual).toLocaleString('id-ID')}</div>
</div>

<div class="qty">${i.qty}</div>

<button class="blue" onclick="formAksi('${i.id}')">📥</button>

</div>
`

})

document.getElementById("listArea").innerHTML=html

}

/* ===========================
FORM TAMBAH
=========================== */

function formTambah(){

document.getElementById("judul").style.display="none"
document.getElementById("listArea").style.display="none"
document.getElementById("formArea").style.display="block"

document.getElementById("formArea").innerHTML=`

<div class="box">

<h3>Tambah Barang</h3>

<input id="t_nama" placeholder="Nama barang">
<input id="t_penitip" placeholder="Nama penitip">
<input id="t_qty" type="number" placeholder="Jumlah titip">
<input id="t_jual" type="number" placeholder="Harga jual">
<input id="t_pen" type="number" placeholder="Harga dari penitip">

<button class="green" onclick="simpanTambah()">Simpan</button>
<button class="red" onclick="renderList()">Batal</button>

</div>
`

}

async function simpanTambah(){

let nama=document.getElementById("t_nama").value.trim()
let penitip=document.getElementById("t_penitip").value.trim()
let qty=parseInt(document.getElementById("t_qty").value||0)
let jual=parseInt(document.getElementById("t_jual").value||0)
let pen=parseInt(document.getElementById("t_pen").value||0)

if(!nama || !penitip || qty<=0){
alert("Lengkapi data")
return
}

const {error}=await window.supabaseClient
.from("barang_titipan")
.insert({
nama_item:nama,
nama_penitip:penitip,
qty:qty,
harga_jual:jual,
harga_penitip:pen
})

if(error){
alert(error.message)
console.log(error)
return
}

const {data:newItem}=await window.supabaseClient
.from("barang_titipan")
.select("*")
.eq("nama_item",nama)
.order("created_at",{ascending:false})
.limit(1)
.single()

await window.supabaseClient
.from("titipan_log")
.insert({
item_id:newItem.id,
jenis:"masuk",
qty:qty,
total:0
})

loadData()

}

/* ===========================
FORM AKSI
=========================== */

function formAksi(id){

window.CURRENT=window.DATA.find(x=>x.id==id)
if(!window.CURRENT) return

document.getElementById("judul").style.display="none"
document.getElementById("listArea").style.display="none"
document.getElementById("aksiArea").style.display="block"

document.getElementById("aksiArea").innerHTML=`

<div class="box">

<h3>${window.CURRENT.nama_item}</h3>

<div class="check">
<input type="checkbox" id="c_ambil" onchange="toggleAksi()"> Ambil
</div>

<div id="boxAmbil" style="display:none">

<input id="sisa" type="number" placeholder="Sisa barang" oninput="hitungDariSisa()">
<input id="jualLaku" type="number" placeholder="Barang terjual" oninput="hitungDariJual()">
<input id="bayar" placeholder="Total dibayar" readonly>

</div>

<div class="check">
<input type="checkbox" id="c_harga" onchange="toggleAksi()"> Update Harga
</div>

<div id="boxHarga" style="display:none">

<input id="u_jual" type="number" value="${window.CURRENT.harga_jual}">
<input id="u_pen" type="number" value="${window.CURRENT.harga_penitip}">

</div>

<div class="check">
<input type="checkbox" id="c_nitip" onchange="toggleAksi()"> Nitip
</div>

<div id="boxNitip" style="display:none">

<input id="n_qty" type="number" placeholder="Qty baru">

</div>

<button class="green" onclick="prosesAksi()">✓</button>
<button class="red" onclick="renderList()">Batal</button>

</div>
`

}

/* ===========================
SHOW HIDE
=========================== */

function toggleAksi(){

document.getElementById("boxAmbil").style.display=
document.getElementById("c_ambil").checked?"block":"none"

document.getElementById("boxHarga").style.display=
document.getElementById("c_harga").checked?"block":"none"

document.getElementById("boxNitip").style.display=
document.getElementById("c_nitip").checked?"block":"none"

}

/* ===========================
REALTIME HITUNG
=========================== */

function hitungDariSisa(){

let s=parseInt(document.getElementById("sisa").value||0)
let laku=window.CURRENT.qty-s
if(laku<0) laku=0

document.getElementById("jualLaku").value=laku
document.getElementById("bayar").value=
"Rp "+(laku*window.CURRENT.harga_penitip).toLocaleString('id-ID')

}

function hitungDariJual(){

let laku=parseInt(document.getElementById("jualLaku").value||0)
let sisa=window.CURRENT.qty-laku
if(sisa<0) sisa=0

document.getElementById("sisa").value=sisa
document.getElementById("bayar").value=
"Rp "+(laku*window.CURRENT.harga_penitip).toLocaleString('id-ID')

}

/* ===========================
PROSES
=========================== */

async function prosesAksi(){

let updateData={}

let ambil=document.getElementById("c_ambil").checked
let harga=document.getElementById("c_harga").checked
let nitip=document.getElementById("c_nitip").checked

if(ambil && !nitip){

let terjual=parseInt(document.getElementById("jualLaku").value||0)
let total=terjual * window.CURRENT.harga_penitip

updateData.qty=0

await window.supabaseClient
.from("titipan_log")
.insert({
item_id:window.CURRENT.id,
jenis:"ambil",
qty:terjual,
total:total
})

}

if(nitip){

let q=parseInt(document.getElementById("n_qty").value||0)

if(q<=0){
alert("Isi qty baru")
return
}

updateData.qty=q

await window.supabaseClient
.from("titipan_log")
.insert({
item_id:window.CURRENT.id,
jenis:"masuk",
qty:q,
total:0
})

}

if(harga){
updateData.harga_jual=parseInt(document.getElementById("u_jual").value||0)
updateData.harga_penitip=parseInt(document.getElementById("u_pen").value||0)

await window.supabaseClient
.from("titipan_log")
.insert({
item_id:window.CURRENT.id,
jenis:"harga",
qty:0,
total:0
})
}

updateData.updated_at=new Date()

const {error}=await window.supabaseClient
.from("barang_titipan")
.update(updateData)
.eq("id",window.CURRENT.id)

if(error){
alert(error.message)
console.log(error)
return
}

loadData()

}

loadData()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
window.__SUGER_LOADED__=true
const s=document.createElement("script")
s.src="https://suger-cdn.vercel.app/suger-dev.js"
document.body.appendChild(s)
}
</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
