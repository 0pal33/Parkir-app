<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Stok Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:130px;
}

h3{
text-align:center;
margin-top:0;
}

.box{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:12px;
}

.row2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:12px;
}

.card{
background:#fff;
padding:14px;
border-radius:14px;
text-align:center;
}

.card small{
display:block;
color:#777;
margin-bottom:6px;
}

.card b{
font-size:28px;
color:#27ae60;
}

.item{
background:#fff;
padding:12px;
border-radius:14px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.nama{font-weight:bold;font-size:18px}
.kecil{font-size:13px;color:#666}
.qty{font-size:28px;font-weight:bold}

button{
border:none;
border-radius:12px;
padding:10px 14px;
font-size:15px;
cursor:pointer;
}

.green{background:#2ecc71;color:#fff}
.blue{background:#3498db;color:#fff}
.red{background:#e74c3c;color:#fff}
.gray{background:#95a5a6;color:#fff}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
margin-bottom:10px;
}

.floating{
position:fixed;
right:20px;
bottom:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.floating button{
width:60px;
height:60px;
border-radius:50%;
font-size:24px;
padding:0;
}

#formArea,#pesanArea{
display:none;
}

.checkLine{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.checkLine input{
width:22px;
height:22px;
margin:0;
}

.topBack{
position:fixed;
left:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
font-size:24px;
padding:0;
}
</style>
</head>
<body>

<h3 id="judul">Stok Barang</h3>

<div class="row2">
<div class="card">
<small>Pendapatan Hari Ini</small>
<b id="pendapatan">0</b>
</div>

<div class="card">
<small>Pengeluaran Hari Ini</small>
<b id="pengeluaran">0</b>
</div>
</div>

<input id="searchBox" placeholder="Cari barang..." oninput="renderList()">

<div id="listArea"></div>
<div id="formArea"></div>
<div id="pesanArea"></div>

<button class="topBack gray" onclick="location.href='index.html'">⌂</button>

<div class="floating">
<button class="blue" onclick="openPesan()">🛒</button>
<button class="green" onclick="formTambah()">＋</button>
</div>

<script>
let DATA=[]
let saveLock=false

async function loadData(){

const {data,error}=await window.supabaseClient
.from("stok_barang")
.select("*")
.order("nama_item")

if(error){
alert(error.message)
return
}

DATA=data||[]

renderList()
loadDashboard()
}

/* =======================
DASHBOARD
======================= */

async function loadDashboard(){

let now=new Date().toDateString()

const {data}=await window.supabaseClient
.from("stok_log")
.select("*")
.order("created_at",{ascending:false})
.limit(200)

let masuk=0
let keluar=0

;(data||[]).forEach(i=>{

if(new Date(i.created_at).toDateString()!==now) return

if(i.jenis==="jual"){
masuk += Number(i.total||0)
}

if(i.jenis==="pesan"){
keluar += Number(i.total||0)
}

})

pendapatan.innerText="Rp "+masuk.toLocaleString("id-ID")
pengeluaran.innerText="Rp "+keluar.toLocaleString("id-ID")
}

/* =======================
LIST
======================= */

function renderList(){

formArea.style.display="none"
pesanArea.style.display="none"
listArea.style.display="block"
judul.style.display="block"
searchBox.style.display="block"

let cari=searchBox.value.toLowerCase()
let html=""

let rows=DATA.filter(i=>
(i.nama_item||"").toLowerCase().includes(cari)
)

if(rows.length===0){
html="<div class='box'>Tidak ada data</div>"
}

rows.forEach(i=>{

html+=`
<div class="item">

<div style="flex:1">
<div class="nama">${i.nama_item}</div>
<div class="kecil">Modal Rp ${Number(i.harga_beli||0).toLocaleString('id-ID')}</div>
<div class="kecil">Jual Rp ${Number(i.harga_jual||0).toLocaleString('id-ID')}</div>
</div>

<div class="qty">${i.qty}</div>

<button class="blue" onclick="auditItem('${i.id}')">✏️</button>

</div>
`
})

listArea.innerHTML=html
}

/* =======================
AUDIT
======================= */

async function auditItem(id){

let item=DATA.find(x=>x.id==id)
if(!item) return

let sisa=prompt("Stok sisa sekarang:",item.qty)
if(sisa===null) return

sisa=parseInt(sisa)
if(isNaN(sisa)) return

if(sisa>item.qty){
alert("Tidak boleh melebihi stok sekarang")
return
}

let terjual=item.qty-sisa
let total=terjual * Number(item.harga_jual||0)

await window.supabaseClient
.from("stok_barang")
.update({qty:sisa})
.eq("id",id)

if(terjual>0){

await window.supabaseClient
.from("stok_log")
.insert({
item_id:id,
jenis:"jual",
qty:terjual,
total:total
})

}

loadData()
}

/* =======================
FORM TAMBAH
======================= */

function formTambah(){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
pesanArea.style.display="none"
formArea.style.display="block"

formArea.innerHTML=`

<div class="box">

<h3>Tambah Barang</h3>

<input id="f_nama" placeholder="Nama barang">
<input id="f_beli" type="number" placeholder="Harga beli">
<input id="f_jual" type="number" placeholder="Harga jual">
<input id="f_qtypesan" type="number" placeholder="Qty tiap pesan">

<div class="checkLine">
<input type="checkbox" id="f_dihitung" checked>
<span>Barang dihitung</span>
</div>

<button class="green" onclick="simpanBarang()">Simpan</button>
<button class="red" onclick="renderList()">Batal</button>

</div>
`
}

async function simpanBarang(){

if(saveLock) return
saveLock=true

let nama=f_nama.value.trim()
let beli=parseInt(f_beli.value||0)
let jual=parseInt(f_jual.value||0)
let qtypesan=parseInt(f_qtypesan.value||1)
let dihitung=f_dihitung.checked

if(!nama){
alert("Nama wajib diisi")
saveLock=false
return
}

const {error}=await window.supabaseClient
.from("stok_barang")
.insert({
nama_item:nama,
qty:0,
harga_beli:beli,
harga_jual:jual,
qty_pesan:qtypesan,
barang_dihitung:dihitung
})

saveLock=false

if(error){
alert(error.message)
return
}

loadData()
}

/* =======================
PESAN BARANG
======================= */

function openPesan(){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
formArea.style.display="none"
pesanArea.style.display="block"

let html=`<div class="box"><h3>Pesan Barang</h3>`

DATA.forEach((i,idx)=>{

let cek=i.qty<5 ? "checked" : ""

html+=`
<div class="item">

<div style="flex:1">
<label>
<input type="checkbox" data-index="${idx}" ${cek}>
 ${i.nama_item}
</label>
<div class="kecil">Tambah ${i.qty_pesan||1}</div>
</div>

<div>${i.qty}</div>

</div>
`
})

html+=`
<button class="green" onclick="kirimPesan()">Kirim WA</button>
<button class="red" onclick="renderList()">Batal</button>
</div>
`

pesanArea.innerHTML=html
}

async function kirimPesan(){

let text="Pesan barang:%0A"
let total=0

let checks=pesanArea.querySelectorAll("input[type=checkbox]")

for(let el of checks){

if(!el.checked) continue

let i=DATA[el.dataset.index]

text += "- "+i.nama_item+"%0A"

let tambah=parseInt(i.qty_pesan||1)

await window.supabaseClient
.from("stok_barang")
.update({
qty:i.qty+tambah
})
.eq("id",i.id)

let biaya=Number(i.harga_beli||0)

total += biaya

await window.supabaseClient
.from("stok_log")
.insert({
item_id:i.id,
jenis:"pesan",
qty:tambah,
total:biaya
})

}

window.open("https://wa.me/6282132517947?text="+text)

loadData()
}
loadData()
</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
