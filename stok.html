<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Stok Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:140px;
}

.item{
background:white;
padding:12px;
border-radius:10px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
}

.left{
display:flex;
align-items:center;
gap:10px;
}

.nama{font-weight:bold}
.qty{font-size:18px}

.edit{
background:#3498db;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

/* FLOATING */
.floating{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.floating button{
width:60px;
height:60px;
border:none;
border-radius:50%;
color:white;
font-size:22px;
}

.pesan{background:#3498db}
.tambah{background:#2ecc71}

/* MODE PESAN */
#modePesan{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:#fff;
padding:20px;
overflow:auto;
display:none;
}

.total{
position:fixed;
bottom:90px;
left:0;
right:0;
text-align:center;
font-weight:bold;
font-size:18px;
}

.kirim{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
background:#2ecc71;
color:white;
font-size:26px;
border:none;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
font-size:16px;
}

.checkLine{
display:flex;
align-items:center;
gap:10px;
font-size:16px;
}

.checkLine input{
width:20px;
height:20px;
margin:0;
}

#formTambah button{
padding:12px;
border:none;
border-radius:10px;
margin-right:10px;
}

#formTambah button:first-child{
background:#2ecc71;
color:white;
}

#formTambah button:last-child{
background:#e74c3c;
color:white;
}

</style>

</head>

<body>

<h3 id="judulPage">Stok Barang</h3>

<div id="list"></div>

<!-- FLOATING -->
<div class="floating">
<button class="pesan" onclick="openPesan()">🛒</button>
<button class="tambah" onclick="formTambah()">+</button>
</div>

<!-- MODE PESAN -->
<div id="modePesan">
<h3>Pesan Barang</h3>

<div id="listPesan"></div>

<div class="total">
Sediakan uang : Rp <span id="total">0</span>
</div>

<button class="kirim" onclick="kirimWA()">➤</button>
</div>

<div id="formTambah" style="display:none; padding:20px;">

<h3>Tambah Barang</h3>

<input id="f_nama" placeholder="Nama barang"><br><br>
<input id="f_beli" type="number" placeholder="Harga beli"><br><br>

<label class="checkLine">
<input type="checkbox" id="f_dihitung" checked onchange="toggleJual()">
<span>Barang dihitung</span>
</label><br><br>

<input id="f_jual" type="number" placeholder="Harga jual"><br><br>

<button onclick="simpanBarang()">Simpan</button>
<button onclick="closeForm()">Batal</button>

</div>

<script>

let DATA = []

async function loadStok(){

const {data,error} = await window.supabaseClient
.from("stok_barang")
.select("*")
.order("nama_item")

if(error){
alert("Gagal load")
return
}

DATA = data

renderList()

}

function renderList(){

let html=""

DATA.forEach(i=>{

html+=`
<div class="item">

<div class="left">
<div>
<div class="nama">${i.nama_item}</div>
<div>Rp ${Number(i.harga_beli||0).toLocaleString('id-ID')}</div>
</div>
</div>

<div class="qty">${i.qty}</div>

<button class="edit" onclick="editQty('${i.id}',${i.qty})">✏️</button>

</div>
`
})

document.getElementById("list").innerHTML = html

}

async function editQty(id,oldQty){

let qty = prompt("Update qty:",oldQty)
if(qty===null) return

qty = parseInt(qty)
if(isNaN(qty)) return

if(qty > oldQty){
alert("Tidak boleh melebihi stok saat ini")
return
}

await window.supabaseClient
.from("stok_barang")
.update({qty})
.eq("id",id)

loadStok()

}

function formTambah(){
  document.getElementById("judulPage").style.display="none"
  document.getElementById("list").style.display="none"
  document.querySelector(".floating").style.display="none"
  document.getElementById("formTambah").style.display="block"
}

function closeForm(){
  document.getElementById("judulPage").style.display="block"
  document.getElementById("formTambah").style.display="none"
  document.getElementById("list").style.display="block"
  document.querySelector(".floating").style.display="flex"
}

function toggleJual(){
  const check = document.getElementById("f_dihitung").checked
  const jual = document.getElementById("f_jual")

  if(check){
    jual.disabled = false
  }else{
    jual.value = 0
    jual.disabled = true
  }
}

async function simpanBarang(){

let nama_item = document.getElementById("f_nama").value.trim()
let harga_beli = parseInt(document.getElementById("f_beli").value || 0)
let barang_dihitung = document.getElementById("f_dihitung").checked
let harga_jual = parseInt(document.getElementById("f_jual").value || 0)

if(!nama_item){
  alert("Nama barang wajib")
  return
}

if(!barang_dihitung){
  harga_jual = 0
}

const { error } = await window.supabaseClient
.from("stok_barang")
.insert({
  nama_item,
  qty:0,
  harga_beli,
  harga_jual,
  barang_dihitung
})

if(error){
  alert("Nama barang sudah ada / gagal simpan")
  return
}

alert("Berhasil ditambahkan")

closeForm()
loadStok()

}

/* ======================
MODE PESAN
====================== */

function openPesan(){

document.getElementById("modePesan").style.display="block"

let html=""

DATA.forEach((i,idx)=>{

let auto = i.barang_dihitung && i.qty < 5

html+=`
<div class="item">

<div class="left">
<input type="checkbox" 
${auto?'checked':''}
onchange="updateTotal()"
data-index="${idx}"
>

<div>
<div class="nama">${i.nama_item}</div>
<div>Rp ${Number(i.harga_beli||0).toLocaleString('id-ID')}</div>
</div>
</div>

<div class="qty">${i.qty}</div>

</div>
`
})

document.getElementById("listPesan").innerHTML = html

updateTotal()

}

function updateTotal(){

let total = 0

document.querySelectorAll("#listPesan input").forEach(el=>{

if(el.checked){
let i = DATA[el.dataset.index]
total += Number(i.harga_beli||0)
}

})

document.getElementById("total").innerText = total.toLocaleString('id-ID')

}

async function kirimWA(){

let text=""

for(let el of document.querySelectorAll("#listPesan input")){

if(el.checked){

let i = DATA[el.dataset.index]

text += i.nama_item + "%0A"

/* =====================
UPDATE STOK OTOMATIS
===================== */

let tambah = 1

if(i.barang_dihitung){
tambah = i.harga_jual || 1   // ← qty per pesan
}

await window.supabaseClient
.from("stok_barang")
.update({
qty: i.qty + tambah
})
.eq("id", i.id)

}

}

let url = `https://wa.me/6282132517947?text=${text}`
window.open(url)

setTimeout(loadStok,500)

}

loadStok()
toggleJual()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
window.__SUGER_LOADED__=true
const s=document.createElement("script")
s.src="https://suger-cdn.vercel.app/suger-dev.js"
document.body.appendChild(s)
}
</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
