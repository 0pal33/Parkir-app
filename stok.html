<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:15px;
padding-bottom:140px;
}

h3{text-align:center;}

.card{
background:white;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
flex-direction:column;
}

.nama{font-weight:bold;}
.harga{font-size:12px;color:#666;}

.qtyBox{
display:flex;
align-items:center;
gap:6px;
}

.qtyBtn{
padding:6px 10px;
border:none;
border-radius:6px;
background:#ddd;
}

.qty{
min-width:25px;
text-align:center;
font-weight:bold;
}

.checkbox{
margin-right:10px;
transform:scale(1.3);
}

.floating{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.floating button{
width:60px;
height:60px;
border:none;
border-radius:50%;
color:white;
font-size:22px;
cursor:pointer;
}

.tambah{background:#2ecc71}
.pesan{background:#3498db}

.totalBox{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:12px;
text-align:center;
font-weight:bold;
box-shadow:0 -3px 10px rgba(0,0,0,0.1);
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.modalBox{
background:white;
padding:20px;
border-radius:12px;
width:90%;
max-width:300px;
}

.modal input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<h3>Stok Barang</h3>

<div id="list"></div>

<div class="totalBox">
Sediakan uang: Rp <span id="total">0</span>
</div>

<div class="floating">
<button class="pesan" onclick="kirimWA()">📤</button>
<button class="tambah" onclick="openModal()">+</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modalBox">

<h4>Tambah Barang</h4>

<input id="nama" placeholder="Nama barang">
<input id="beli" placeholder="Harga beli" type="number">
<input id="jual" placeholder="Harga jual" type="number">

<label>
<input type="checkbox" id="dihitung" checked>
 Barang dihitung
</label>

<br><br>

<button onclick="simpan()">Simpan</button>
<button onclick="closeModal()">Batal</button>

</div>
</div>

<script>

let DATA = []

async function loadStok(){

const {data,error} = await window.supabaseClient
.from("stok_barang")
.select("*")
.order("nama_item",{ascending:true})

if(error){
console.log(error)
alert("Gagal load")
return
}

DATA = data || []

render()

}

function render(){

let html=""
let total=0

DATA.forEach(item=>{

let checked = item.barang_dihitung && item.qty < 5

if(checked){
total += (item.harga_beli || 0)
}

html+=`
<div class="card">

<div style="display:flex;align-items:center">

<input type="checkbox" class="checkbox"
${checked?"checked":""}
onchange="toggleCheck('${item.id}',this.checked)">

<div class="left">
<div class="nama">${item.nama_item}</div>
<div class="harga">Rp ${(item.harga_beli||0).toLocaleString('id-ID')}</div>
</div>

</div>

<div class="qtyBox">

<button class="qtyBtn" onclick="updateQty('${item.id}',-1)">-</button>
<div class="qty">${item.qty || 0}</div>
<button class="qtyBtn" onclick="updateQty('${item.id}',1)">+</button>

</div>

</div>
`
})

document.getElementById("list").innerHTML = html
document.getElementById("total").innerText = total.toLocaleString('id-ID')

}

async function updateQty(id,delta){

let item = DATA.find(i=>i.id===id)
if(!item) return

let newQty = (item.qty || 0) + delta
if(newQty < 0) newQty = 0

await window.supabaseClient
.from("stok_barang")
.update({qty:newQty})
.eq("id",id)

loadStok()

}

function toggleCheck(id,val){

let item = DATA.find(i=>i.id===id)
if(!item) return

item.checked = val

updateTotalManual()

}

function updateTotalManual(){

let total=0

DATA.forEach(i=>{
if(i.checked){
total += (i.harga_beli || 0)
}
})

document.getElementById("total").innerText = total.toLocaleString('id-ID')

}

function kirimWA(){

let text=""
let total=0

DATA.forEach(i=>{
if(i.checked){
text += i.nama_item + "%0A"
total += (i.harga_beli || 0)
}
})

if(!text){
alert("Tidak ada item dipilih")
return
}

let url = `https://wa.me/6282132517947?text=${text}%0A%0ASediakan uang: Rp ${total.toLocaleString('id-ID')}`

window.open(url)

}

/* MODAL */

function openModal(){
document.getElementById("modal").style.display="flex"
}

function closeModal(){
document.getElementById("modal").style.display="none"
}

function simpan(){

let nama = document.getElementById("nama").value.trim()
let beli = parseInt(document.getElementById("beli").value||0)
let jual = parseInt(document.getElementById("jual").value||0)
let dihitung = document.getElementById("dihitung").checked

if(!nama){
alert("Nama wajib")
return
}

window.supabaseClient
.from("stok_barang")
.insert({
nama_item:nama,
qty:0,
harga_beli:beli,
harga_jual:dihitung ? jual : 0,
barang_dihitung:dihitung
})
.then(()=>{
closeModal()
loadStok()
})

}

loadStok()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  window.addEventListener("DOMContentLoaded", ()=>{
    const script = document.createElement("script")
    script.src = "https://suger-cdn.vercel.app/suger-dev.js"
    document.body.appendChild(script)
  })
}
</script>

</body>
</html>
