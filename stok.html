<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Stok Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:140px;
}

h3{
text-align:center;
margin-top:0;
}

.box{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:12px;
}

.row2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:12px;
}

.card{
background:#fff;
padding:14px;
border-radius:14px;
text-align:center;
}

.card small{
display:block;
color:#777;
margin-bottom:6px;
}

.card b{
font-size:28px;
color:#27ae60;
}

.item{
background:#fff;
padding:12px;
border-radius:14px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.item.redbg{
background:#ffd6d6;
}

.nama{
font-weight:bold;
font-size:18px;
}

.kecil{
font-size:13px;
color:#666;
}

.qty{
font-size:28px;
font-weight:bold;
min-width:45px;
text-align:center;
user-select:none;
}

button{
border:none;
border-radius:12px;
padding:10px 14px;
font-size:15px;
cursor:pointer;
}

.green{background:#2ecc71;color:#fff;}
.blue{background:#3498db;color:#fff;}
.red{background:#e74c3c;color:#fff;}
.gray{background:#95a5a6;color:#fff;}
.orange{background:#f39c12;color:#fff;}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
margin-bottom:10px;
}

.smallInput{
width:90px;
margin:0;
padding:8px;
font-size:15px;
}

.floating{
position:fixed;
right:20px;
bottom:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.floating button{
width:60px;
height:60px;
border-radius:50%;
font-size:24px;
padding:0;
}

.topBack{
position:fixed;
left:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
font-size:24px;
padding:0;
}

#formArea,#pesanArea,#auditArea{
display:none;
}

.checkLine{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.checkLine input{
width:22px;
height:22px;
margin:0;
}

.rowBtn{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.rowBtn button{
flex:1;
}

.rightBtn{
display:flex;
gap:6px;
align-items:center;
}

.menuDots{
font-size:24px;
font-weight:bold;
padding:8px 12px;
cursor:pointer;
user-select:none;
touch-action:manipulation;
opacity:.7;
}

.dragging{
opacity:.5;
transform:scale(1.02);
z-index:999;
position:relative;
box-shadow:0 10px 20px rgba(0,0,0,.18);
}

.item{
transition:.15s;
touch-action:pan-y;
}

.tableWrap{
overflow-x:auto;
margin-bottom:12px;
}

.tbl{
width:100%;
border-collapse:collapse;
font-size:14px;
background:#fff;
border-radius:12px;
overflow:hidden;
}

.tbl th,.tbl td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.tbl th{
background:#f7f7f7;
font-weight:bold;
}

.tbl input{
margin:0;
padding:6px;
width:75px;
font-size:14px;
}

.tbl input[type="checkbox"]{
width:20px;
height:20px;
padding:0;
margin:0;
}

.sortable-chosen{
opacity:0.6;
}

.sortable-ghost{
opacity:0.3;
}
</style>
</head>

<body>

<h3 id="judul">Stok Barang</h3>

<div class="row2">
<div class="card">
<small>Pendapatan Hari Ini</small>
<b id="pendapatan">Rp 0</b>
</div>

<div class="card">
<small>Pengeluaran Hari Ini</small>
<b id="pengeluaran">Rp 0</b>
</div>
</div>

<input id="searchBox" placeholder="Cari barang..." oninput="renderList()">

<div class="rowBtn" style="margin-bottom:8px;">
<button class="green" onclick="setFilter('hitung')">Stok</button>
<button class="gray" onclick="setFilter('tidak')">nonStok</button>
</div>

<div class="rowBtn" style="margin-bottom:12px;">
<button class="orange" onclick="showAuditRestok()">Audit Restok</button>
<button class="red" onclick="batalPesanan()">Batal Pesanan</button>
</div>

<div id="listArea"></div>
<div id="formArea"></div>
<div id="pesanArea"></div>
<div id="auditArea"></div>

<button class="topBack red" onclick="location.href='dashboard.html'">⌂</button>

<div class="floating">
<button class="blue" onclick="openPesan()">🛒</button>
<button class="green" onclick="formTambah()">＋</button>
</div>

<script>
let DATA=[]
let LAST_UNDO=null
let LAST_ORDER=[]
let FILTER_MODE="all"

function saveOrder(){
localStorage.setItem("LAST_ORDER",JSON.stringify(LAST_ORDER))
}

function loadOrder(){
let x=localStorage.getItem("LAST_ORDER")

if(x){
try{
LAST_ORDER=JSON.parse(x)||[]
}catch(e){
LAST_ORDER=[]
}
}
}

function clearOrder(){
LAST_ORDER=[]
localStorage.removeItem("LAST_ORDER")
}

function rupiah(n){
return "Rp " + Number(n||0).toLocaleString("id-ID")
}

function nowWIB(){
return new Date(
new Date().toLocaleString("en-US",{timeZone:"Asia/Jakarta"})
)
}

function sameDay(a,b){
return a.getFullYear()===b.getFullYear() &&
a.getMonth()===b.getMonth() &&
a.getDate()===b.getDate()
}

async function loadData(){

const {data,error}=await window.supabaseClient
.from("stok_barang")
.select("*")
.order("urutan",{ascending:true})
.order("nama_item",{ascending:true})

if(error){
alert(error.message)
return
}

DATA=data||[]

renderList()
loadDashboard()
}

/* ======================
DASHBOARD
====================== */

async function loadDashboard(){

const {data}=await window.supabaseClient
.from("stok_log")
.select("*")
.order("created_at",{ascending:false})
.limit(500)

let masuk=0
let keluar=0
let now=nowWIB()

;(data||[]).forEach(i=>{

let t=new Date(i.created_at)
if(!sameDay(now,new Date(t.toLocaleString("en-US",{timeZone:"Asia/Jakarta"})))) return

if(i.jenis==="jual") masuk+=Number(i.total||0)
if(i.jenis==="pesan") keluar+=Number(i.total||0)

})

pendapatan.innerText=rupiah(masuk)
pengeluaran.innerText=rupiah(keluar)
}

function setFilter(mode){
FILTER_MODE=mode
renderList()
}

/* ======================
LIST
====================== */

function renderList(){

formArea.style.display="none"
pesanArea.style.display="none"
auditArea.style.display="none"
listArea.style.display="block"
judul.style.display="block"
searchBox.style.display="block"

let cari=searchBox.value.toLowerCase()
let now=nowWIB()
let html=""

let rows=DATA.filter(i=>{

let cocokNama=(i.nama_item||"").toLowerCase().includes(cari)

if(!cocokNama) return false

if(FILTER_MODE==="hitung") return i.barang_dihitung===true
if(FILTER_MODE==="tidak") return i.barang_dihitung===false

return true

})

if(rows.length===0){
html="<div class='box'>Tidak ada data</div>"
}

rows.forEach(i=>{

let merah=true

if(i.updated_at){

let t = new Date(
new Date(i.updated_at).toLocaleString("en-US",{timeZone:"Asia/Jakarta"})
)

if(sameDay(now,t)) merah=false
}

html+=`
<div class="item ${merah?'redbg':''}"
data-id="${i.id}">

<div class="menuDots"
data-id="${i.id}"
data-nama="${i.nama_item}"
onclick="klikDots(event,this)">
☰
</div>

<div style="flex:1">

<div class="nama"
onclick="editNama('${i.id}','${i.nama_item}')">
${i.nama_item}
</div>

<div class="kecil"
onclick="editJual('${i.id}',${i.harga_jual})">
Jual ${rupiah(i.harga_jual)}
</div>

</div>

<div class="qty"
onclick="editQty('${i.id}',${i.qty},${i.harga_jual},${i.barang_dihitung})">
${i.qty}
</div>

<div class="rightBtn">
<button class="gray" onclick="undoItem('${i.id}')">↩</button>
</div>

</div>
`
})

listArea.innerHTML=html
initSortable()
}

function initSortable(){

let el = document.getElementById("listArea")

// 🔥 destroy dulu kalau sudah ada
if(sortableInstance){
sortableInstance.destroy()
}

sortableInstance = Sortable.create(el,{
animation:150,
handle:".menuDots",
delay:100,
delayOnTouchOnly:true,
ghostClass:"dragging",
fallbackOnBody: true,
swapThreshold: 0.65,

onEnd: async function (evt){

let items = [...document.querySelectorAll(".item")]

let newOrder = items.map(el => el.dataset.id)

// update DATA sesuai urutan DOM (INI LEBIH AMAN)
DATA.sort((a,b)=>{
return newOrder.indexOf(a.id) - newOrder.indexOf(b.id)
})

// simpan ke database
for(let i=0;i<DATA.length;i++){

await window.supabaseClient
.from("stok_barang")
.update({urutan:i+1})
.eq("id",DATA[i].id)

}

loadData()

}
})
}

async function editNama(id,nama){

let baru=prompt("Nama item:",nama)
if(!baru) return

await window.supabaseClient
.from("stok_barang")
.update({
nama_item:baru,
updated_at:new Date().toISOString()
})
.eq("id",id)

loadData()
}

async function editJual(id,harga){

let baru=prompt("Harga jual:",harga)
if(baru===null) return

baru=parseInt(baru||0)

await window.supabaseClient
.from("stok_barang")
.update({
harga_jual:baru,
updated_at:new Date().toISOString()
})
.eq("id",id)

loadData()
}

/* ======================
AUDIT STOK
====================== */

async function editQty(id,qtyLama,hargaJual,dihitung){

let teks = dihitung ? "Stok baru:" : "Jumlah terjual:"
let baru=prompt(teks,qtyLama)

if(baru===null) return

baru=parseInt(baru)
if(isNaN(baru)) return

let item = DATA.find(x=>x.id==id)

let qtyBaru=baru
let qtyJual=0

/* =====================
BARANG STOK
===================== */
if(dihitung){

if(qtyBaru > qtyLama){
alert("Barang stok tidak boleh melebihi stok saat ini")
return
}

qtyJual = qtyLama - qtyBaru
if(qtyJual < 0) qtyJual=0

}

/* =====================
BARANG NONSTOK
===================== */
else{

qtyJual = qtyBaru
qtyBaru = qtyBaru

}

let totalMasuk = qtyJual * hargaJual

LAST_UNDO={
id:id,
qty:qtyLama,
harga_jual:hargaJual,
harga_beli:item ? item.harga_beli : 0,
log_qty:qtyJual,
log_total:totalMasuk
}

await window.supabaseClient
.from("stok_barang")
.update({
qty:qtyBaru,
updated_at:new Date().toISOString()
})
.eq("id",id)

if(qtyJual>0){

await window.supabaseClient
.from("stok_log")
.insert({
item_id:id,
jenis:"jual",
qty:qtyJual,
total:totalMasuk
})

}

loadData()
}

/* ======================
UNDO
====================== */

async function undoItem(id){

if(!LAST_UNDO || LAST_UNDO.id!==id){
alert("Tidak ada undo terakhir")
return
}

await window.supabaseClient
.from("stok_barang")
.update({
qty:LAST_UNDO.qty,
harga_jual:LAST_UNDO.harga_jual,
harga_beli:LAST_UNDO.harga_beli,
updated_at:new Date().toISOString()
})
.eq("id",id)

/* hapus log jual terakhir */

if(LAST_UNDO.log_qty>0){

const {data}=await window.supabaseClient
.from("stok_log")
.select("id")
.eq("item_id",id)
.eq("jenis","jual")
.eq("qty",LAST_UNDO.log_qty)
.eq("total",LAST_UNDO.log_total)
.order("created_at",{ascending:false})
.limit(1)

if(data && data.length){

await window.supabaseClient
.from("stok_log")
.delete()
.eq("id",data[0].id)

}

}

LAST_UNDO=null
loadData()
}

function klikDots(e,el){

// kalau lagi drag, skip
if(sortableInstance && sortableInstance.dragging){
return
}

hapusItem(
el.dataset.id,
el.dataset.nama
)

}

async function hapusItem(id,nama){

let ok=confirm("Hapus item:\n"+nama+" ?")
if(!ok) return

await window.supabaseClient
.from("stok_barang")
.delete()
.eq("id",id)

loadData()
}

/* ======================
FORM TAMBAH
====================== */

function formTambah(){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
pesanArea.style.display="none"
auditArea.style.display="none"
formArea.style.display="block"

formArea.innerHTML=`

<div class="box">

<h3>Tambah Barang</h3>

<input id="f_nama" placeholder="Nama barang">
<input id="f_beli" type="number" placeholder="Harga beli">
<input id="f_awal" type="number" placeholder="Masukkan stok barang saat ini">

<div class="checkLine">
<input type="checkbox" id="f_dihitung" checked onchange="toggleHitung()">
<span>Barang dihitung</span>
</div>

<div id="boxHitung">
<input id="f_jual" type="number" placeholder="Harga jual">
<input id="f_qtypesan" type="number" placeholder="Jumlah tiap restok">
</div>

<div class="rowBtn">
<button class="green" onclick="simpanBarang()">Simpan</button>
<button class="red" onclick="renderList()">Batal</button>
</div>

</div>
`

toggleHitung()
}

function toggleHitung(){
boxHitung.style.display=f_dihitung.checked?"block":"none"
}

async function simpanBarang(){

let nama=f_nama.value.trim()
let beli=parseInt(f_beli.value||0)
let awal=parseInt(f_awal.value||0)
let dihitung=f_dihitung.checked

let jual=0
let qtypesan=1

if(dihitung){
jual=parseInt(f_jual.value||0)
qtypesan=parseInt(f_qtypesan.value||1)
}

if(!nama){
alert("Nama wajib")
return
}

const {error}=await window.supabaseClient
.from("stok_barang")
.insert({
nama_item:nama,
urutan: DATA.length+1,
qty:awal,
harga_beli:beli,
harga_jual:jual,
qty_pesan:qtypesan,
barang_dihitung:dihitung,
updated_at:new Date().toISOString()
})

if(error){
alert(error.message)
return
}

loadData()
}

/* ======================
PESAN BARANG
====================== */

function openPesan(){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
formArea.style.display="none"
auditArea.style.display="none"
pesanArea.style.display="block"

let html=`<div class="box">
<h3>Pesan Barang</h3>

<div class="tableWrap">
<table class="tbl">
<tr>
<th>✔</th>
<th>Nama Barang</th>
<th>Harga Beli</th>
<th>Tambah</th>
<th>Stok</th>
</tr>
`

DATA.forEach((i,idx)=>{

if(i.barang_dihitung!==true) return

html+=`
<tr>
<td>
<input type="checkbox" data-index="${idx}">
</td>

<td style="text-align:left">
${i.nama_item}
</td>

<td>
<input inputmode="numeric" id="beli_${idx}" value="${i.harga_beli||0}">
</td>

<td>
<input inputmode="numeric" id="qty_${idx}" value="${i.qty_pesan||1}">
</td>

<td>${i.qty}</td>
</tr>
`
})

html+=`
</table>
</div>

<div class="rowBtn">
<button class="blue" onclick="tambahManual()">Tambah</button>
<button class="green" onclick="kirimPesan()">Kirim WA</button>
<button class="red" onclick="renderList()">Batal</button>
</div>

</div>
`

pesanArea.innerHTML=html
}

async function kirimPesan(){
  
let ada=false

let checks=pesanArea.querySelectorAll("input[type=checkbox]")
let text="Pesan barang:%0A"
LAST_ORDER=[]

for(let el of checks){

if(!el.checked) continue
ada=true

let idx=el.dataset.index
let i=DATA[idx]

let beli=parseInt(document.getElementById("beli_"+idx).value||0)
let tambah=parseInt(document.getElementById("qty_"+idx).value||1)

let dasar=parseInt(i.qty_pesan||1)
if(dasar<=0) dasar=1

let biaya = (beli / dasar) * tambah
biaya = Math.round(biaya)

text += "- "+i.nama_item+"%0A"

await window.supabaseClient
.from("stok_barang")
.update({
qty:i.qty+tambah,
harga_beli:beli,
updated_at:new Date().toISOString()
})
.eq("id",i.id)

await window.supabaseClient
.from("stok_log")
.insert({
item_id:i.id,
jenis:"pesan",
qty:tambah,
total:biaya
})

LAST_ORDER.push({
id:i.id,
nama:i.nama_item,
qty:tambah,
beli:beli,
dasar:dasar
})

saveOrder()

}

if(!ada){
alert("Pilih barang dulu")
return
}

window.open("https://wa.me/6282132517947?text="+text)
loadData()
}

async function tambahManual(){

if(window.loadingTambah) return
window.loadingTambah=true

let checks=pesanArea.querySelectorAll("input[type=checkbox]")
let ada=false

for(let el of checks){

if(!el.checked) continue
ada=true

let idx=el.dataset.index
let i=DATA[idx]

let beli=parseInt(document.getElementById("beli_"+idx).value||0)
let tambah=parseInt(document.getElementById("qty_"+idx).value||1)

let dasar=parseInt(i.qty_pesan||1)
if(dasar<=0) dasar=1

let biaya=(beli/dasar)*tambah
biaya=Math.round(biaya)

await window.supabaseClient
.from("stok_barang")
.update({
qty:i.qty+tambah,
harga_beli:beli,
updated_at:new Date().toISOString()
})
.eq("id",i.id)

await window.supabaseClient
.from("stok_log")
.insert({
item_id:i.id,
jenis:"pesan",
qty:tambah,
total:biaya
})

}

if(!ada){
window.loadingTambah=false
alert("Pilih barang dulu")
return
}

loadData()
renderList()
window.loadingTambah=false
alert("Stok berhasil ditambah")
}

/* ======================
AUDIT RESTOK
====================== */

function showAuditRestok(){

judul.style.display="none"
searchBox.style.display="none"
listArea.style.display="none"
formArea.style.display="none"
pesanArea.style.display="none"
auditArea.style.display="block"

let html=`<div class="box"><h3>Audit Restok</h3>`

if(LAST_ORDER.length===0){
html+=`Tidak ada pesanan terakhir`
}else{

LAST_ORDER.forEach((i,idx)=>{

html+=`
<div class="item">

<div style="flex:1">
<div class="nama">${i.nama}</div>
</div>

<input class="smallInput" id="restok_${idx}" value="${i.qty}">
<button class="red" onclick="stokKosong(${idx})">✖</button>

</div>
`
})

html+=`
<button class="green" onclick="simpanAuditRestok()">Simpan Audit</button>
`
}

html+=`
<button class="gray" onclick="renderList()">Kembali</button>
</div>
`

auditArea.innerHTML=html
}

function stokKosong(idx){

let ok=confirm("Yakin stok datang = 0 ?")

if(!ok) return

document.getElementById("restok_"+idx).value=0
}

async function simpanAuditRestok(){

for(let x=0;x<LAST_ORDER.length;x++){

let row = LAST_ORDER[x]
let real = parseInt(document.getElementById("restok_"+x).value||0)
let pesan = row.qty

if(real < 0) real = 0

let selisih = pesan - real

if(selisih !== 0){

let item = DATA.find(a=>a.id==row.id)

if(item){

/* ===================
PERBAIKI STOK
=================== */

await window.supabaseClient
.from("stok_barang")
.update({
qty:item.qty-selisih,
updated_at:new Date().toISOString()
})
.eq("id",row.id)

/* ===================
PERBAIKI LOG PESAN
=================== */

let dasar = parseInt(row.dasar||1)
if(dasar <= 0) dasar = 1

let beli = Number(row.beli||0)

/* biaya real datang */
let totalBaru = Math.round((beli / dasar) * real)

/* cari log pesan terakhir */
const {data} = await window.supabaseClient
.from("stok_log")
.select("id")
.eq("item_id",row.id)
.eq("jenis","pesan")
.order("created_at",{ascending:false})
.limit(1)

if(data && data.length){

await window.supabaseClient
.from("stok_log")
.update({
qty:real,
total:totalBaru
})
.eq("id",data[0].id)

}

}

}

}

clearOrder()
loadData()
renderList()
}

async function batalPesanan(){

if(LAST_ORDER.length===0){
alert("Tidak ada pesanan terakhir")
return
}

let ok=confirm("Batalkan pesanan terakhir?")
if(!ok) return

for(let row of LAST_ORDER){

let item=DATA.find(x=>x.id==row.id)

if(item){

await window.supabaseClient
.from("stok_barang")
.update({
qty:item.qty-row.qty,
updated_at:new Date().toISOString()
})
.eq("id",row.id)

const {data}=await window.supabaseClient
