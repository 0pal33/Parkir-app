<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
padding-bottom:140px;
}

.item{
background:white;
padding:12px;
border-radius:10px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
}

.left{
display:flex;
align-items:center;
gap:10px;
}

.nama{font-weight:bold}
.qty{font-size:18px}

.edit{
background:#3498db;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

/* FLOATING */
.floating{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.floating button{
width:60px;
height:60px;
border:none;
border-radius:50%;
color:white;
font-size:22px;
}

.pesan{background:#3498db}
.tambah{background:#2ecc71}

/* MODE PESAN */
#modePesan{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:#fff;
padding:20px;
overflow:auto;
display:none;
}

.total{
position:fixed;
bottom:90px;
left:0;
right:0;
text-align:center;
font-weight:bold;
font-size:18px;
}

.kirim{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
background:#2ecc71;
color:white;
font-size:26px;
border:none;
}

</style>

</head>

<body>

<h3>Stok Barang</h3>

<div id="list"></div>

<!-- FLOATING -->
<div class="floating">
<button class="pesan" onclick="openPesan()">🛒</button>
<button class="tambah" onclick="formTambah()">+</button>
</div>

<!-- MODE PESAN -->
<div id="modePesan">
<h3>Pesan Barang</h3>

<div id="listPesan"></div>

<div class="total">
Sediakan uang : Rp <span id="total">0</span>
</div>

<button class="kirim" onclick="kirimWA()">➤</button>
</div>

<script>

let DATA = []

async function loadStok(){

const {data,error} = await window.supabaseClient
.from("stok_barang")
.select("*")
.order("nama")

if(error){
alert("Gagal load")
return
}

DATA = data

renderList()

}

function renderList(){

let html=""

DATA.forEach(i=>{

html+=`
<div class="item">

<div class="left">
<input type="checkbox" disabled>
<div>
<div class="nama">${i.nama}</div>
<div>Rp ${Number(i.harga_beli||0).toLocaleString('id-ID')}</div>
</div>
</div>

<div class="qty">${i.qty}</div>

<button class="edit" onclick="editQty('${i.id}',${i.qty})">✏️</button>

</div>
`
})

document.getElementById("list").innerHTML = html

}

async function editQty(id,oldQty){

let qty = prompt("Update qty:",oldQty)
if(qty===null) return

qty = parseInt(qty)
if(isNaN(qty)) return

await window.supabaseClient
.from("stok_barang")
.update({qty})
.eq("id",id)

loadStok()

}

function formTambah(){

let nama = prompt("Nama barang")
if(!nama) return

let beli = parseInt(prompt("Harga beli")||0)

let dihitung = confirm("Barang dihitung? (OK = YA)")

let jual = 0
if(dihitung){
jual = parseInt(prompt("Harga jual")||0)
}

window.supabaseClient
.from("stok_barang")
.insert({
nama,
qty:0,
harga_beli:beli,
harga_jual:dihitung?jual:0,
dihitung
})
.then(loadStok)

}

/* ======================
MODE PESAN
====================== */

function openPesan(){

document.getElementById("modePesan").style.display="block"

let html=""

DATA.forEach((i,idx)=>{

let auto = i.dihitung && i.qty < 5

html+=`
<div class="item">

<div class="left">
<input type="checkbox" 
${auto?'checked':''}
onchange="updateTotal()"
data-index="${idx}"
>

<div>
<div class="nama">${i.nama}</div>
<div>Rp ${Number(i.harga_beli||0).toLocaleString('id-ID')}</div>
</div>
</div>

<div class="qty">${i.qty}</div>

</div>
`
})

document.getElementById("listPesan").innerHTML = html

updateTotal()

}

function updateTotal(){

let total = 0

document.querySelectorAll("#listPesan input").forEach(el=>{

if(el.checked){
let i = DATA[el.dataset.index]
total += Number(i.harga_beli||0)
}

})

document.getElementById("total").innerText = total.toLocaleString('id-ID')

}

function kirimWA(){

let text=""

document.querySelectorAll("#listPesan input").forEach(el=>{

if(el.checked){
let i = DATA[el.dataset.index]
text += i.nama + "%0A"
}

})

let url = `https://wa.me/6282132517947?text=${text}`

window.open(url)

}

loadStok()

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
window.__SUGER_LOADED__=true
const s=document.createElement("script")
s.src="https://suger-cdn.vercel.app/suger-dev.js"
document.body.appendChild(s)
}
</script>

</body>
</html>
