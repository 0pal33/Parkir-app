<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<title>Parkir Aktif</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/parkirEngine.js"></script>

<style>

body{
font-family:Arial;
background:#eee;
padding:20px;
text-align:center;
}

table{
width:100%;
max-width:500px;
margin:auto;
border-collapse:collapse;
background:white;
}

td,th{
border:1px solid #ddd;
padding:8px;
}

th{
background:#3498db;
color:white;
}

.headerParkir{
background:linear-gradient(135deg,#2f80ed,#56ccf2);
color:white;
padding:18px;
text-align:center;
border-radius:10px 10px 0 0;
max-width:500px;
margin:auto;
}

.titleParkir{
font-size:22px;
font-weight:bold;
}

.totalParkir{
font-size:15px;
margin-top:4px;
opacity:0.95;
}

.tableWrapper{
max-height:420px;
overflow-y:auto;
max-width:500px;
margin:auto;
}

</style>

</head>

<body>

<div class="headerParkir">
 
<div class="titleParkir"> Parkir Aktif </div>

<div class="totalParkir" id="totalParkir">
Total parkir aktif 0
</div>

</div>

<div class="tableWrapper">

<table>

<tr>
<th>QR</th>
<th>Mulai</th>
<th>Durasi</th>
</tr>

<tbody id="list"></tbody>

</table>

</div>

<br>

<button onclick="history.back()">Kembali</button>

<script>

async function load(){

const {data}=await window.supabaseClient
.from("parkir")
.select("*")
.eq("status","on")
.order("checkin_at",{ascending:true})

let html=""

data.forEach(p=>{

let start=new Date(p.checkin_at)
let now=new Date()

let durasi=hitungDurasiParkir(start,now)

html+=`
<tr>
<td>${p.kode}</td>
<td>${start.toLocaleString('id-ID')}</td>
<td>${durasi} hari</td>
</tr>
`

})

document.getElementById("list").innerHTML=html
document.getElementById("totalParkir").innerText =
"Total parkir aktif: " + data.length

}

load()

setInterval(load,5000)

</script>

<script>
if(IS_DEV && !window.__SUGER_LOADED__){
  window.__SUGER_LOADED__ = true

  const script = document.createElement("script")
  script.src = "https://suger-cdn.vercel.app/suger-dev.js"
  document.body.appendChild(script)
}
</script>

<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js')
}
</script>

</body>
</html>
