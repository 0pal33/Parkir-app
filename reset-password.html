<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{
  font-family:Arial;
  background:#eee;
  text-align:center;
  padding:20px;
}
.box{
  max-width:420px;
  margin:40px auto;
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
input{
  width:80%;
  padding:12px;
  margin:8px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  padding:14px 18px;
  margin:8px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
.blue{background:#3498db;color:white}
.gray{background:#95a5a6;color:white}
#status{
  min-height:24px;
  margin:12px 0;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>
<body>
<div class="box">
  <h2>Reset Password</h2>
  <p>Masukkan password baru untuk akun kamu.</p>

  <input id="newPassword" type="password" placeholder="Password baru" autocomplete="new-password"><br>
  <input id="confirmPassword" type="password" placeholder="Ulangi password baru" autocomplete="new-password"><br>

  <div id="status"></div>

  <button id="saveBtn" class="blue" type="button">Simpan Password</button>
  <button id="backBtn" class="gray" type="button">Kembali ke Login</button>
</div>

<script>
window.addEventListener("DOMContentLoaded", ()=>{
  const newPassword = document.getElementById("newPassword")
  const confirmPassword = document.getElementById("confirmPassword")
  const saveBtn = document.getElementById("saveBtn")
  const backBtn = document.getElementById("backBtn")
  const status = document.getElementById("status")

  backBtn.addEventListener("click", ()=>{
    location.href = "admin.html"
  })

  let recoveryReady = false

  function setStatus(message){
    status.textContent = message
  }

  async function checkRecoverySession(){
    const { data, error } = await window.supabaseClient.auth.getSession()

    if(error){
      setStatus("Sesi reset password tidak bisa dibaca. Silakan minta link reset baru.")
      return
    }

    if(data.session){
      recoveryReady = true
      return
    }

    setStatus("Link reset tidak valid atau sudah kedaluwarsa. Silakan minta link reset baru.")
    saveBtn.disabled = true
  }

  window.supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(event === "PASSWORD_RECOVERY" && session){
      recoveryReady = true
      setStatus("Silakan masukkan password baru.")
      saveBtn.disabled = false
    }
  })

  saveBtn.addEventListener("click", async ()=>{
    if(!recoveryReady){
      setStatus("Link reset belum siap. Silakan buka kembali link dari email reset password.")
      return
    }

    const password = newPassword.value
    const confirmation = confirmPassword.value

    if(password.length < 6){
      setStatus("Password minimal 6 karakter.")
      return
    }

    if(password !== confirmation){
      setStatus("Konfirmasi password tidak sama.")
      return
    }

    saveBtn.disabled = true
    saveBtn.innerText = "Menyimpan..."
    setStatus("")

    const { error } = await window.supabaseClient.auth.updateUser({
      password
    })

    if(error){
      setStatus("Gagal mengubah password: " + error.message)
      saveBtn.disabled = false
      saveBtn.innerText = "Simpan Password"
      return
    }

    alert("Password berhasil diubah. Silakan login dengan password baru.")

    await window.supabaseClient.auth.signOut()
    location.href = "admin.html"
  })

  checkRecoverySession()
})
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
}
</script>
</body>
</html>
